<body data-theme="emerald">
    <div id="root"></div>

    <script type="module">
        import * as webllm from "https://esm.run/@mlc-ai/web-llm@0.2.85";
        window.webllm = webllm;

        if (navigator.storage && navigator.storage.persist) {
            navigator.storage.persist().catch(() => {});
        }

        window.dispatchEvent(new CustomEvent('webllm-ready'));
    </script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Theme Options
        const THEMES = [
            { id: 'emerald', name: 'Emerald', color: '#10b981' },
            { id: 'indigo', name: 'Indigo', color: '#6366f1' },
            { id: 'cyberpunk', name: 'Neon Pink', color: '#ec4899' },
            { id: 'amber', name: 'Amber', color: '#f59e0b' },
            { id: 'obsidian', name: 'Obsidian', color: '#e4e4e7' }
        ];

        // Loader Style Options
        const LOADER_STYLES = [
            { id: 'chip', name: 'CallChip' },
            { id: 'linear', name: 'Progress Bar' },
            { id: 'orbit', name: 'Cyber Orbit' }
        ];

        // Universal Loader Renderer
        function UniversalLoader({ style = 'chip', name = 'webllm', argument = 'model', status = 'running', progress = 0.45, text = '' }) {
            const pct = Math.min(100, Math.max(0, Math.round((progress || 0) * 100)));

            if (style === 'linear') {
                return (
                    <div className="linear-loader">
                        <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '0.78rem' }}>
                            <span style={{ fontWeight: 600 }}>{name} {argument}</span>
                            <span style={{ color: 'var(--primary)', fontWeight: 700 }}>{pct}%</span>
                        </div>
                        <div className="linear-track">
                            <div className="linear-fill" style={{ width: `${pct}%` }}></div>
                        </div>
                        {text && <div style={{ fontSize: '0.7rem', color: 'var(--text-faint)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{text}</div>}
                    </div>
                );
            }

            if (style === 'orbit') {
                return (
                    <div className="orbit-loader">
                        <i className="fa-solid fa-circle-notch fa-spin" style={{ color: 'var(--primary)', fontSize: '1.1rem' }}></i>
                        <div>
                            <div style={{ fontSize: '0.82rem', fontWeight: 600, display: 'flex', alignItems: 'center', gap: 6 }}>
                                <span>{argument}</span>
                                <span style={{ color: 'var(--primary)' }}>{pct}%</span>
                            </div>
                            {text && <div style={{ fontSize: '0.68rem', color: 'var(--text-faint)', maxWidth: 200, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{text}</div>}
                        </div>
                    </div>
                );
            }

            // Default: CallChip
            return (
                <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 6 }}>
                    <span className="call-chip" data-status={status}>
                        <span className="call-chip__fill" style={{ transform: `scaleX(${Math.max(0.04, progress || 0)})`, transition: 'transform 200ms ease' }} />
                        <span className="call-chip__slot">
                            {status === 'running' && <i className="fa-solid fa-circle-notch fa-spin"></i>}
                            {status === 'done' && <i className="fa-solid fa-check" style={{ color: '#22c55e' }}></i>}
                            {status === 'error' && <i className="fa-solid fa-rotate-right" style={{ color: '#ef4444' }}></i>}
                        </span>
                        <span className="call-chip__name">{name}</span>
                        <span className="call-chip__arg">{argument}</span>
                        <span className="call-chip__timer" style={{ color: 'var(--accent)', fontWeight: 600 }}>{pct}%</span>
                    </span>
                    {text && (
                        <div style={{ fontSize: "0.74rem", color: "var(--text-faint)", maxWidth: 360, textOverflow: "ellipsis", overflow: "hidden", whiteSpace: "nowrap" }}>
                            {text}
                        </div>
                    )}
                </div>
            );
        }

        // ===== ReactBits GlideSelect Component =====
        function GlideSelect({ options = [], value, onChange, disabled }) {
            const [open, setOpen] = useState(false);
            const menuRef = useRef(null);

            useEffect(() => {
                const onDown = (e) => {
                    if (menuRef.current && !menuRef.current.contains(e.target)) {
                        setOpen(false);
                    }
                };
                if (open) document.addEventListener('pointerdown', onDown);
                return () => document.removeEventListener('pointerdown', onDown);
            }, [open]);

            const current = options.find(o => o.value === value) || options[0];

            return (
                <div className="glide-select" ref={menuRef}>
                    <button 
                        type="button"
                        className="glide-select__trigger" 
                        onClick={() => !disabled && setOpen(!open)}
                        disabled={disabled}
                    >
                        <span>{current ? current.label : 'Select Model'}</span>
                        <i className={`fa-solid fa-chevron-down ${open ? 'fa-rotate-180' : ''}`} style={{ fontSize: 11, transition: 'transform 0.2s' }}></i>
                    </button>
                    {open && (
                        <div className="glide-select__menu">
                            {options.map(opt => (
                                <div 
                                    key={opt.value}
                                    className="glide-select__option"
                                    aria-selected={opt.value === value}
                                    onClick={() => {
                                        onChange(opt.value);
                                        setOpen(false);
                                    }}
                                >
                                    <span style={{ fontWeight: 500, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                                        {opt.label}
                                    </span>
                                    {opt.tag && <span style={{ fontSize: 10, color: 'var(--text-faint)' }}>{opt.tag}</span>}
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        }

        // ===== ReactBits StatusMark Component =====
        function StatusMark({ status = 'running', label }) {
            return (
                <span className="status-mark" data-status={status}>
                    <svg className="status-mark__glyph" viewBox="0 0 24 24" width="18" height="18">
                        <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" strokeWidth="2" opacity="0.2" />
                        {status === 'running' && (
                            <circle className="status-mark__ring" cx="12" cy="12" r="9" fill="none" stroke="currentColor" strokeWidth="2" strokeDasharray="14 40" strokeLinecap="round" />
                        )}
                        {status === 'done' && (
                            <path d="M7 12 l3.5 3.5 l7 -7" fill="none" stroke="#22c55e" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" />
                        )}
                        {status === 'failed' && (
                            <path d="M8 8 l8 8 M16 8 l-8 8" fill="none" stroke="#ef4444" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" />
                        )}
                    </svg>
                    {label && <span style={{ fontSize: 13, color: status === 'done' ? '#22c55e' : status === 'failed' ? '#ef4444' : 'inherit' }}>{label}</span>}
                </span>
            );
        }

        // Extracts all virtual files from assistant text
        function parseVirtualFiles(content) {
            if (!content) return { files: {}, hasCode: false };
            const files = {};
            let hasCode = false;

            const codeBlockRegex = /```([a-zA-Z0-9_-]+)?(?:\s+(?:filename=)?["']?([a-zA-Z0-9_.-]+)["']?)?\s*\n([\s\S]*?)(?:```|$)/g;
            let match;
            let defaultIndex = 1;

            while ((match = codeBlockRegex.exec(content)) !== null) {
                const lang = (match[1] || '').toLowerCase();
                let explicitName = match[2];
                const code = match[3];

                if (!code && !lang) continue;
                hasCode = true;

                if (!explicitName) {
                    const headerComment = code.slice(0, 100).match(/(?:<!--|\/\*|\/\/)\s*([a-zA-Z0-9_.-]+\.(html|css|js|jsx|json|ts|svg))\s*(?:-->|\*\/)?/i);
                    if (headerComment && headerComment[1]) {
                        explicitName = headerComment[1].trim();
                    }
                }

                if (!explicitName) {
                    if (lang === 'html' || code.includes('<html') || code.includes('<!DOCTYPE') || code.includes('<body') || code.includes('<div') || code.includes('<canvas')) {
                        explicitName = 'index.html';
                    } else if (lang === 'css' || (code.includes('{') && code.includes('margin:'))) {
                        explicitName = Object.keys(files).some(k => k.endsWith('.css')) ? `style${defaultIndex++}.css` : 'style.css';
                    } else if (lang === 'js' || lang === 'javascript') {
                        explicitName = Object.keys(files).some(k => k.endsWith('.js')) ? `script${defaultIndex++}.js` : 'script.js';
                    } else {
                        explicitName = `file${defaultIndex++}.${lang || 'txt'}`;
                    }
                }

                files[explicitName] = code.trim();
            }

            if (!hasCode && (content.includes('<!DOCTYPE html') || content.includes('<html') || content.includes('```html'))) {
                hasCode = true;
                const clean = content.replace(/```html?/i, '').replace(/```$/, '').trim();
                files['index.html'] = clean;
            }

            return { files, hasCode };
        }

        // Bundles multi-file virtual directory into an execution-safe document
        function bundleMultiFiles(files, isStreaming = false) {
            const fileKeys = Object.keys(files);
            if (fileKeys.length === 0) return "";

            let mainHtml = files['index.html'] || files[fileKeys.find(k => k.endsWith('.html'))] || "";

            const endScriptTag = '<' + '/script>';
            const endStyleTag = '<' + '/style>';

            let safeHtml = mainHtml;
            if (isStreaming) {
                safeHtml = safeHtml.replace(/<script\b[^<]*(?:(?!<\/script>)<[^<]*)*$/i, '');
            }

            if (!safeHtml) {
                const css = files['style.css'] || files[fileKeys.find(k => k.endsWith('.css'))] || "";
                const js = !isStreaming ? (files['script.js'] || files[fileKeys.find(k => k.endsWith('.js'))] || "") : "";
                return '<!DOCTYPE html><html><head><meta charset="utf-8"><style>' + css + endStyleTag + '</head><body><script>' + js + endScriptTag + '</body></html>';
            }

            safeHtml = safeHtml.replace(/<link\s+[^>]*href=["']([^"']+\.css)["'][^>]*>/gi, (tag, href) => {
                const baseName = href.split('/').pop();
                if (files[baseName]) {
                    return '<style>/* ' + baseName + ' */\n' + files[baseName] + '\n' + endStyleTag;
                }
                return tag;
            });

            safeHtml = safeHtml.replace(/<script\s+[^>]*src=["']([^"']+\.js)["'][^>]*>\s*<\/script>/gi, (tag, src) => {
                const baseName = src.split('/').pop();
                if (files[baseName] && !isStreaming) {
                    return '<script>/* ' + baseName + ' */\n' + files[baseName] + '\n' + endScriptTag;
                }
                return '';
            });

            for (const [k, code] of Object.entries(files)) {
                if (k.endsWith('.css') && !safeHtml.includes(code)) {
                    safeHtml += '\n<style>/* ' + k + ' */\n' + code + '\n' + endStyleTag;
                }
            }

            if (!isStreaming) {
                for (const [k, code] of Object.entries(files)) {
                    if (k.endsWith('.js') && !safeHtml.includes(code)) {
                        safeHtml += '\n<script>/* ' + k + ' */\n' + code + '\n' + endScriptTag;
                    }
                }
            }

            return safeHtml;
        }

        function App() {
            const [models, setModels] = useState([]);
            const [usedModels, setUsedModels] = useState(() => {
                try {
                    const saved = localStorage.getItem('ai_studio_used_models');
                    return saved ? JSON.parse(saved) : [];
                } catch (e) {
                    return [];
                }
            });
            const [selectedModel, setSelectedModel] = useState("");
            const [engineReady, setEngineReady] = useState(false);
            const [loadingState, setLoadingState] = useState({ active: false, text: "", progress: 0 });
            const [isGenerating, setIsGenerating] = useState(false);
            const [totalTokens, setTotalTokens] = useState(0);

            // User Settings: Theme & Loader Style
            const [theme, setTheme] = useState(() => localStorage.getItem('ai_studio_theme') || 'emerald');
            const [loaderStyle, setLoaderStyle] = useState(() => localStorage.getItem('ai_studio_loader') || 'chip');
            const [settingsOpen, setSettingsOpen] = useState(false);
            const [temperature, setTemperature] = useState(0.7);
            const [autoOpenCanvas, setAutoOpenCanvas] = useState(true);

            // Apply theme to body
            useEffect(() => {
                document.body.setAttribute('data-theme', theme);
                localStorage.setItem('ai_studio_theme', theme);
            }, [theme]);

            // Save loader style
            useEffect(() => {
                localStorage.setItem('ai_studio_loader', loaderStyle);
            }, [loaderStyle]);

            // Chat History System
            const [sessions, setSessions] = useState(() => {
                try {
                    const saved = localStorage.getItem('ai_studio_sessions');
                    return saved ? JSON.parse(saved) : [{ id: 'default', title: 'New Chat', messages: [], files: {} }];
                } catch (e) {
                    return [{ id: 'default', title: 'New Chat', messages: [], files: {} }];
                }
            });
            const [currentSessionId, setCurrentSessionId] = useState('default');
            const [historyOpen, setHistoryOpen] = useState(true); // Open by default for easy access to settings & models

            const [input, setInput] = useState("");
            const [virtualFiles, setVirtualFiles] = useState({});
            const [activeFileTab, setActiveFileTab] = useState("preview");
            const [showCanvas, setShowCanvas] = useState(false);

            const engineRef = useRef(null);
            const streamEndRef = useRef(null);
            const inputRef = useRef(null);
            const iframeRef = useRef(null);

            const activeSession = sessions.find(s => s.id === currentSessionId) || sessions[0];
            const messages = activeSession ? activeSession.messages : [];

            // Save chat history
            useEffect(() => {
                try {
                    localStorage.setItem('ai_studio_sessions', JSON.stringify(sessions));
                } catch (e) {}
            }, [sessions]);

            // Save used models history
            useEffect(() => {
                try {
                    localStorage.setItem('ai_studio_used_models', JSON.stringify(usedModels));
                } catch (e) {}
            }, [usedModels]);

            // Delete cached model from WebLLM IndexedDB and history
            const deleteCachedModel = async (e, modelId) => {
                e.stopPropagation();
                if (!confirm(`Delete cached weights for ${modelId} from browser storage?`)) return;
                try {
                    if (window.webllm && window.webllm.deleteModelAllInfoInCache) {
                        await window.webllm.deleteModelAllInfoInCache(modelId);
                    } else if (window.webllm && window.webllm.deleteModelInCache) {
                        await window.webllm.deleteModelInCache(modelId);
                    }
                } catch (err) {
                    console.warn("Could not clear WebLLM cache directly:", err);
                }
                setUsedModels(prev => prev.filter(m => m !== modelId));
            };

            // Populate all models dynamically & prefetch tiny demo model wasm
            useEffect(() => {
                const initModels = () => {
                    if (window.webllm && window.webllm.prebuiltAppConfig) {
                        const list = window.webllm.prebuiltAppConfig.model_list.map(m => ({
                            value: m.model_id,
                            label: m.model_id.replace('-MLC', '').replace('-Instruct', ''),
                            tag: m.vram_required_MB ? `${(m.vram_required_MB / 1024).toFixed(1)}GB` : ''
                        }));
                        setModels(list);

                        const defaultChoice = list.find(m => m.value.includes("SmolLM2-135M") || m.value.includes("Llama-3.2-1B")) || list[0];
                        if (defaultChoice) setSelectedModel(defaultChoice.value);

                        if ('requestIdleCallback' in window) {
                            window.requestIdleCallback(() => {
                                const tinyModel = window.webllm.prebuiltAppConfig.model_list.find(m => m.model_id.includes("SmolLM2-135M"));
                                if (tinyModel && tinyModel.model_lib) {
                                    fetch(tinyModel.model_lib, { mode: 'cors', cache: 'force-cache' }).catch(() => {});
                                }
                            });
                        }
                    }
                };

                window.addEventListener('webllm-ready', initModels);
                initModels();
                return () => window.removeEventListener('webllm-ready', initModels);
            }, []);

            useEffect(() => {
                streamEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [messages, isGenerating]);

            const loadModel = async (modelId) => {
                if (!window.webllm) return;
                try {
                    setLoadingState({ active: true, text: "Compiling WebGPU pipeline...", progress: 0.05 });
                    setEngineReady(false);

                    if (engineRef.current) {
                        await engineRef.current.unload();
                    }

                    // Configure sliding window and larger context to prevent ContextWindowSizeExceededError
                    const chatOpts = {
                        context_window_size: 8192,
                        sliding_window_size: 4096,
                        attention_sink_size: 4
                    };

                    const engine = await window.webllm.CreateMLCEngine(modelId, {
                        initProgressCallback: (report) => {
                            setLoadingState({
                                active: true,
                                text: report.text || "Loading weights...",
                                progress: report.progress || 0.1
                            });
                        }
                    }, chatOpts);

                    engineRef.current = engine;
                    setEngineReady(true);
                    setLoadingState({ active: false, text: "Ready", progress: 1 });
                    setUsedModels(prev => prev.includes(modelId) ? prev : [modelId, ...prev]);
                } catch (err) {
                    console.error("WebLLM Init Error:", err);
                    alert("Could not load model: " + (err.message || err));
                    setLoadingState({ active: false, text: "", progress: 0 });
                }
            };

            const createNewSession = () => {
                const newId = 'session_' + Date.now();
                const newSession = { id: newId, title: 'New Chat', messages: [], files: {} };
                setSessions([newSession, ...sessions]);
                setCurrentSessionId(newId);
                setVirtualFiles({});
                setShowCanvas(false);
            };

            const deleteSession = (e, id) => {
                e.stopPropagation();
                if (sessions.length <= 1) {
                    createNewSession();
                    return;
                }
                const filtered = sessions.filter(s => s.id !== id);
                setSessions(filtered);
                if (currentSessionId === id) {
                    setCurrentSessionId(filtered[0].id);
                    setVirtualFiles(filtered[0].files || {});
                }
            };

            const handleSend = async () => {
                const prompt = input.trim();
                if (!prompt || isGenerating) return;

                if (!engineReady || !engineRef.current) {
                    await loadModel(selectedModel);
                    if (!engineRef.current) return;
                }

                const userMsg = { role: "user", content: prompt };
                const newMessages = [...messages, userMsg];
                const aiId = Date.now();
                const withAiPlaceholder = [...newMessages, { role: "assistant", content: "", id: aiId, files: {} }];
                
                // Immediately commit to sessions so chat view displays instantly
                setSessions(prev => prev.map(s => {
                    if (s.id === currentSessionId) {
                        let title = s.title;
                        if (title === 'New Chat' && prompt) {
                            title = prompt.slice(0, 24) + (prompt.length > 24 ? '...' : '');
                        }
                        return { ...s, title, messages: withAiPlaceholder };
                    }
                    return s;
                }));

                setInput("");
                setIsGenerating(true);

                let fullText = "";
                let currentTokens = 0;
                let canvasPopped = false;

                try {
                    const systemMsg = {
                        role: "system",
                        content: "You are an expert full-stack coder. Provide clean, modern code. Default to a single-file implementation (HTML with inline CSS and JS) unless the user requests multiple files or separating them into index.html, style.css, and script.js is cleaner. When using multiple files, prefix each code block with its filename (e.g. ```html index.html or ```css style.css)."
                    };

                    // Context Guard: Keep the system prompt + recent messages to avoid exceeding the model's token limits
                    let cleanHistory = newMessages.map(m => ({ role: m.role, content: m.content }));
                    if (cleanHistory.length > 8) {
                        cleanHistory = cleanHistory.slice(-8); // Keep last 8 turns of conversation
                    }

                    const asyncChunks = await engineRef.current.chat.completions.create({
                        messages: [systemMsg, ...cleanHistory],
                        stream: true,
                        temperature: temperature
                    });

                    for await (const chunk of asyncChunks) {
                        const delta = chunk.choices[0]?.delta?.content || "";
                        fullText += delta;
                        currentTokens++;

                        setTotalTokens(prev => prev + 1);

                        if (autoOpenCanvas && !canvasPopped && (fullText.includes("```") || fullText.includes("<!DOCTYPE") || fullText.includes("<html"))) {
                            setShowCanvas(true);
                            canvasPopped = true;
                        }

                        const { files, hasCode } = parseVirtualFiles(fullText);
                        if (hasCode) {
                            setVirtualFiles(files);
                        }

                        setSessions(prev => prev.map(s => {
                            if (s.id === currentSessionId) {
                                const updated = s.messages.map(m => 
                                    m.id === aiId ? { ...m, content: fullText, tokens: currentTokens, files } : m
                                );
                                return { ...s, messages: updated, files: hasCode ? files : s.files };
                            }
                            return s;
                        }));
                    }
                } catch (err) {
                    console.error("Inference Error:", err);
                    const errorMsg = (err && err.message) ? err.message : String(err);
                    setSessions(prev => prev.map(s => {
                        if (s.id === currentSessionId) {
                            const updated = s.messages.map(m => 
                                m.id === aiId ? { ...m, content: (fullText ? fullText + "\n\n" : "") + "Error: " + errorMsg } : m
                            );
                            return { ...s, messages: updated };
                        }
                        return s;
                    }));
                } finally {
                    setIsGenerating(false);
                }
            };

            const handleKeyDown = (e) => {
                if (e.key === "Enter" && !e.shiftKey) {
                    e.preventDefault();
                    handleSend();
                }
            };

            const renderMarkdown = (content) => {
                if (!content) return { __html: "" };
                try {
                    return { __html: marked.parse(content) };
                } catch (e) {
                    return { __html: content };
                }
            };

            // Open canvas view in a clean about:blank tab with all CSS & JS files bundled
            const openInAboutBlank = () => {
                const fullHtml = bundleMultiFiles(virtualFiles, false);
                const win = window.open('about:blank', '_blank');
                if (win) {
                    win.document.open();
                    win.document.write(fullHtml);
                    win.document.close();
                } else {
                    alert("Pop-up blocked! Please allow pop-ups for this site to open in a new tab.");
                }
            };

            const handleDownload = async (files) => {
                const keys = Object.keys(files);
                if (keys.length === 0) return;

                if (keys.length === 1 && keys[0].endsWith('.html')) {
                    const blob = new Blob([files[keys[0]]], { type: 'text/html;charset=utf-8' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = keys[0] || 'index.html';
                    a.click();
                    URL.revokeObjectURL(url);
                } else {
                    if (!window.JSZip) {
                        alert("ZIP library not loaded");
                        return;
                    }
                    const zip = new window.JSZip();
                    for (const [name, content] of Object.entries(files)) {
                        zip.file(name, content);
                    }
                    const zipBlob = await zip.generateAsync({ type: 'blob' });
                    const url = URL.createObjectURL(zipBlob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'website.zip';
                    a.click();
                    URL.revokeObjectURL(url);
                }
            };

            const compiledHtml = bundleMultiFiles(virtualFiles, isGenerating);

            return (
                <div className="layout">
                    <div className="ambient-bg"></div>

                    {/* Chat History Sidebar */}
                    <aside className={`history-sidebar ${historyOpen ? '' : 'collapsed'}`}>
                        <div className="history-header">
                            <span>History & Models</span>
                            <button className="btn-action" onClick={createNewSession} title="New Chat">
                                <i className="fa-solid fa-plus"></i>
                            </button>
                        </div>

                        <div className="history-list">
                            <div style={{ fontSize: "0.72rem", textTransform: "uppercase", letterSpacing: "0.06em", color: "var(--text-faint)", fontWeight: 700, padding: "6px 8px" }}>
                                Chats
                            </div>
                            {sessions.map(s => (
                                <div 
                                    key={s.id}
                                    className={`history-item ${s.id === currentSessionId ? 'active' : ''}`}
                                    onClick={() => {
                                        setCurrentSessionId(s.id);
                                        setVirtualFiles(s.files || {});
                                        setShowCanvas(Object.keys(s.files || {}).length > 0);
                                    }}
                                >
                                    <span style={{ overflow: 'hidden', textOverflow: 'ellipsis' }}>{s.title}</span>
                                    <i 
                                        className="fa-solid fa-xmark" 
                                        style={{ fontSize: 11, opacity: 0.5 }} 
                                        onClick={(e) => deleteSession(e, s.id)}
                                        title="Delete Chat"
                                    ></i>
                                </div>
                            ))}

                            {/* Downloaded Models List in Sidebar */}
                            {usedModels.length > 0 && (
                                <>
                                    <div style={{ fontSize: "0.72rem", textTransform: "uppercase", letterSpacing: "0.06em", color: "var(--text-faint)", fontWeight: 700, padding: "14px 8px 6px" }}>
                                        Loaded Models ({usedModels.length})
                                    </div>
                                    {usedModels.map(mId => (
                                        <div 
                                            key={mId}
                                            className="history-item"
                                            style={{ fontSize: "0.76rem" }}
                                            onClick={() => {
                                                setSelectedModel(mId);
                                                loadModel(mId);
                                            }}
                                            title={`Switch to ${mId}`}
                                        >
                                            <span style={{ overflow: 'hidden', textOverflow: 'ellipsis', display: 'flex', alignItems: 'center', gap: 6 }}>
                                                <i className="fa-solid fa-microchip" style={{ color: selectedModel === mId ? "var(--primary)" : "inherit" }}></i>
                                                {mId.replace('-MLC', '').replace('-Instruct', '')}
                                            </span>
                                            <i 
                                                className="fa-solid fa-xmark" 
                                                style={{ fontSize: 11, opacity: 0.6, color: '#ef4444', padding: '2px 4px' }} 
                                                onClick={(e) => deleteCachedModel(e, mId)}
                                                title="Delete cached model weights"
                                            ></i>
                                        </div>
                                    ))}
                                </>
                            )}
                        </div>

                        {/* Settings Button in Side Panel at Bottom */}
                        <div className="sidebar-bottom">
                            <button 
                                className="sidebar-settings-btn"
                                onClick={() => setSettingsOpen(true)}
                            >
                                <i className="fa-solid fa-gear"></i>
                                <span>Settings & Themes</span>
                            </button>
                        </div>
                    </aside>

                    <div className="chat-pane">
                        <header className="topbar">
                            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                                <button 
                                    className="btn-action" 
                                    onClick={() => setHistoryOpen(!historyOpen)}
                                    title="Toggle Sidebar"
                                >
                                    <i className="fa-solid fa-bars"></i>
                                </button>
                                <div className="brand">
                                    <StatusMark status={engineReady ? 'done' : loadingState.active ? 'running' : 'failed'} />
                                    <span>AI Studio</span>
                                </div>
                            </div>

                            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                                <GlideSelect 
                                    options={models}
                                    value={selectedModel}
                                    onChange={(val) => {
                                        setSelectedModel(val);
                                        setEngineReady(false);
                                    }}
                                    disabled={loadingState.active || isGenerating}
                                />

                                {!engineReady ? (
                                    <button 
                                        className="btn-action btn-primary"
                                        onClick={() => loadModel(selectedModel)}
                                        disabled={loadingState.active}
                                    >
                                        <i className="fa-solid fa-bolt"></i>
                                        <span>Load</span>
                                    </button>
                                ) : (
                                    <span className="pill-badge" style={{ color: "#22c55e" }}>
                                        <i className="fa-solid fa-check"></i> Ready
                                    </span>
                                )}

                                {totalTokens > 0 && (
                                    <span className="pill-badge">
                                        <i className="fa-solid fa-bolt" style={{ color: "var(--accent)" }}></i> {totalTokens.toLocaleString()} tokens
                                    </span>
                                )}

                                {Object.keys(virtualFiles).length > 0 && !showCanvas && (
                                    <button 
                                        className="btn-action" 
                                        onClick={() => setShowCanvas(true)}
                                        title="Show canvas"
                                    >
                                        <i className="fa-solid fa-desktop"></i> Canvas
                                    </button>
                                )}
                            </div>
                        </header>

                        <div className="chat-stream">
                            {/* Live Model Loader with Customizable Look */}
                            {loadingState.active && (
                                <div style={{ display: "flex", justifyContent: "center", margin: "12px 0" }}>
                                    <UniversalLoader 
                                        style={loaderStyle}
                                        name="webllm" 
                                        argument={selectedModel.split('-')[0]} 
                                        status="running" 
                                        progress={loadingState.progress}
                                        text={loadingState.text}
                                    />
                                </div>
                            )}

                            {messages.length === 0 ? (
                                <div style={{ margin: "auto", textAlign: "center", maxWidth: 440, padding: 20 }}>
                                    <h2 style={{ fontSize: "1.4rem", fontWeight: 700, marginBottom: 8 }}>
                                        Private <span className="shiny-text">WebLLM</span> Chat
                                    </h2>
                                    <p style={{ color: "var(--text-muted)", fontSize: "0.88rem", marginBottom: 24, lineHeight: 1.5 }}>
                                        Runs locally via WebGPU. Prompt below to chat or generate real-time web pages.
                                    </p>

                                    <div style={{ display: "flex", flexDirection: "column", gap: 10, textAlign: "left" }}>
                                        <div 
                                            className="spotlight-card"
                                            onClick={() => { setInput("Create a colorful neon particle gravity simulator using HTML5 canvas."); inputRef.current?.focus(); }}
                                        >
                                            <div style={{ fontWeight: 600, fontSize: "0.85rem", color: "#fff", marginBottom: 2 }}>
                                                Interactive Canvas
                                            </div>
                                            <div style={{ fontSize: "0.78rem", color: "var(--text-muted)" }}>
                                                "Create a colorful neon particle gravity simulator using HTML5 canvas"
                                            </div>
                                        </div>

                                        <div 
                                            className="spotlight-card"
                                            onClick={() => { setInput("Build a modern stopwatch web app with lap times in separate HTML, CSS, and JS files."); inputRef.current?.focus(); }}
                                        >
                                            <div style={{ fontWeight: 600, fontSize: "0.85rem", color: "#fff", marginBottom: 2 }}>
                                                Multi-file Web App
                                            </div>
                                            <div style={{ fontSize: "0.78rem", color: "var(--text-muted)" }}>
                                                "Build a modern stopwatch web app with lap times in separate files"
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            ) : (
                                messages.map((m, idx) => (
                                    <div key={idx} className={`msg-bubble ${m.role === 'user' ? 'user' : 'ai'}`}>
                                        <div className="msg-content">
                                            {m.role === 'user' ? (
                                                m.content
                                            ) : (
                                                <div>
                                                    <div dangerouslySetInnerHTML={renderMarkdown(m.content)} />
                                                    {isGenerating && idx === messages.length - 1 && (
                                                        <span className="cursor-blink"></span>
                                                    )}
                                                    
                                                    <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginTop: 8 }}>
                                                        {m.tokens > 0 && (
                                                            <div style={{ fontSize: "0.72rem", color: "var(--text-faint)", display: "flex", alignItems: "center", gap: 4 }}>
                                                                <i className="fa-solid fa-coins"></i> {m.tokens.toLocaleString()} tokens
                                                            </div>
                                                        )}

                                                        {m.files && Object.keys(m.files).length > 0 && (
                                                            <div className="download-bar">
                                                                <button 
                                                                    className="btn-action"
                                                                    onClick={() => handleDownload(m.files)}
                                                                    title="Download generated website files"
                                                                >
                                                                    <i className="fa-solid fa-download"></i>
                                                                    <span>Download Website ({Object.keys(m.files).length > 1 ? "ZIP" : "HTML"})</span>
                                                                </button>
                                                            </div>
                                                        )}
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                ))
                            )}
                            <div ref={streamEndRef} />
                        </div>

                        <div className="input-bar">
                            <div className="input-wrap">
                                <textarea
                                    ref={inputRef}
                                    className="text-input"
                                    placeholder={engineReady ? "Ask or code anything... (Enter to send)" : "Click 'Load' to start..."}
                                    value={input}
                                    onChange={(e) => setInput(e.target.value)}
                                    onKeyDown={handleKeyDown}
                                    rows="1"
                                />

                                <button
                                    className="send-btn"
                                    onClick={handleSend}
                                    disabled={!input.trim() || isGenerating}
                                    title="Send"
                                >
                                    {isGenerating ? (
                                        <i className="fa-solid fa-spinner fa-spin"></i>
                                    ) : (
                                        <i className="fa-solid fa-arrow-up"></i>
                                    )}
                                </button>
                            </div>
                        </div>
                    </div>

                    {/* Live Canvas / Multi-file Workspace Pane */}
                    {showCanvas && Object.keys(virtualFiles).length > 0 && (
                        <div className="canvas-pane">
                            <div className="canvas-header">
                                <div className="tabs">
                                    <button 
                                        className={`tab-btn ${activeFileTab === 'preview' ? 'active' : ''}`}
                                        onClick={() => setActiveFileTab('preview')}
                                    >
                                        <i className="fa-solid fa-play"></i> Live Preview
                                    </button>
                                    {Object.keys(virtualFiles).map(name => (
                                        <button 
                                            key={name}
                                            className={`tab-btn ${activeFileTab === name ? 'active' : ''}`}
                                            onClick={() => setActiveFileTab(name)}
                                        >
                                            <i className={name.endsWith('.css') ? 'fa-brands fa-css3-alt' : name.endsWith('.js') ? 'fa-brands fa-js' : 'fa-brands fa-html5'}></i> {name}
                                        </button>
                                    ))}
                                </div>

                                <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
                                    <button 
                                        className="btn-action"
                                        onClick={openInAboutBlank}
                                        title="Open full page in about:blank (New Tab)"
                                        style={{ color: "var(--accent)", borderColor: "var(--border-active)" }}
                                    >
                                        <i className="fa-solid fa-arrow-up-right-from-square"></i>
                                        <span>about:blank</span>
                                    </button>
                                    <button 
                                        className="btn-action"
                                        onClick={() => handleDownload(virtualFiles)}
                                        title="Download All Files"
                                    >
                                        <i className="fa-solid fa-download"></i>
                                    </button>
                                    <button 
                                        className="btn-action"
                                        onClick={() => {
                                            if (iframeRef.current) {
                                                iframeRef.current.srcdoc = bundleMultiFiles(virtualFiles, false);
                                            }
                                        }}
                                        title="Refresh preview"
                                    >
                                        <i className="fa-solid fa-rotate-right"></i>
                                    </button>
                                    <button 
                                        className="btn-action"
                                        onClick={() => setShowCanvas(false)}
                                        title="Close"
                                    >
                                        <i className="fa-solid fa-xmark"></i>
                                    </button>
                                </div>
                            </div>

                            <div className="preview-body">
                                {activeFileTab === 'preview' ? (
                                    <iframe 
                                        ref={iframeRef}
                                        className="preview-iframe" 
                                        srcDoc={compiledHtml}
                                        sandbox="allow-scripts allow-modals"
                                    />
                                ) : (
                                    <pre className="code-view">
                                        <code>{virtualFiles[activeFileTab]}</code>
                                    </pre>
                                )}
                            </div>
                        </div>
                    )}

                    {/* Settings Modal (Theme, Loader Look with Preview, Creativity) */}
                    {settingsOpen && (
                        <div className="modal-backdrop" onClick={() => setSettingsOpen(false)}>
                            <div className="settings-card" onClick={e => e.stopPropagation()}>
                                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
                                    <h3 style={{ fontSize: "1rem", fontWeight: 700, color: "#fff", display: "flex", alignItems: "center", gap: 8 }}>
                                        <i className="fa-solid fa-sliders" style={{ color: "var(--primary)" }}></i> Studio Settings
                                    </h3>
                                    <button className="btn-action" style={{ padding: "4px 8px" }} onClick={() => setSettingsOpen(false)}>
                                        <i className="fa-solid fa-xmark"></i>
                                    </button>
                                </div>

                                {/* Theme Selector */}
                                <div style={{ padding: "10px 0", borderBottom: "1px solid rgba(255,255,255,0.06)" }}>
                                    <div style={{ fontWeight: 600, color: "#fff", fontSize: "0.85rem", marginBottom: 6 }}>
                                        Color Theme
                                    </div>
                                    <div className="theme-grid">
                                        {THEMES.map(t => (
                                            <div 
                                                key={t.id}
                                                className={`theme-pill ${theme === t.id ? 'active' : ''}`}
                                                onClick={() => setTheme(t.id)}
                                            >
                                                <div className="theme-color-dot" style={{ background: t.color }}></div>
                                                <span style={{ color: theme === t.id ? '#fff' : 'var(--text-muted)' }}>{t.name}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                {/* Loading Style Selector with Live Preview */}
                                <div style={{ padding: "12px 0", borderBottom: "1px solid rgba(255,255,255,0.06)" }}>
                                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
                                        <div style={{ fontWeight: 600, color: "#fff", fontSize: "0.85rem" }}>
                                            Loader Style
                                        </div>
                                        <div style={{ display: "flex", gap: 6 }}>
                                            {LOADER_STYLES.map(l => (
                                                <button 
                                                    key={l.id}
                                                    className={`btn-action ${loaderStyle === l.id ? 'btn-primary' : ''}`}
                                                    style={{ padding: "3px 8px", fontSize: "0.74rem" }}
                                                    onClick={() => setLoaderStyle(l.id)}
                                                >
                                                    {l.name}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    {/* Loader Live Interactive Preview */}
                                    <div className="loader-preview-box">
                                        <UniversalLoader 
                                            style={loaderStyle}
                                            name="webllm"
                                            argument="Llama-3.2"
                                            status="running"
                                            progress={0.68}
                                            text="Fetching shader weights (preview)..."
                                        />
                                    </div>
                                </div>

                                {/* Model Creativity (Temperature) */}
                                <div className="settings-row">
                                    <div>
                                        <div style={{ fontWeight: 500, color: "#fff" }}>Creativity (Temperature)</div>
                                        <div style={{ fontSize: "0.72rem", color: "var(--text-faint)" }}>Higher = more expressive, lower = deterministic</div>
                                    </div>
                                    <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                                        <input 
                                            type="range" 
                                            min="0.1" 
                                            max="1.5" 
                                            step="0.05" 
                                            value={temperature}
                                            onChange={e => setTemperature(parseFloat(e.target.value))}
                                            className="settings-slider"
                                        />
                                        <span style={{ fontSize: "0.8rem", color: "var(--primary)", minWidth: 28, textAlign: "right" }}>{temperature}</span>
                                    </div>
                                </div>

                                {/* Auto-open Canvas Toggle */}
                                <div className="settings-row">
                                    <div>
                                        <div style={{ fontWeight: 500, color: "#fff" }}>Auto-open Canvas</div>
                                        <div style={{ fontSize: "0.72rem", color: "var(--text-faint)" }}>Pop up preview immediately on code generation</div>
                                    </div>
                                    <input 
                                        type="checkbox" 
                                        checked={autoOpenCanvas} 
                                        onChange={e => setAutoOpenCanvas(e.target.checked)} 
                                        style={{ accentColor: "var(--primary)", width: 18, height: 18, cursor: "pointer" }}
                                    />
                                </div>

                                <div className="settings-row" style={{ borderBottom: "none", paddingTop: 14 }}>
                                    <button 
                                        className="btn-action" 
                                        style={{ width: "100%", justifyContent: "center", color: "#ef4444", borderColor: "rgba(239, 68, 68, 0.3)" }}
                                        onClick={() => {
                                            if (confirm("Reset all conversations, themes, and stored files?")) {
                                                localStorage.removeItem('ai_studio_sessions');
                                                localStorage.removeItem('ai_studio_used_models');
                                                localStorage.removeItem('ai_studio_theme');
                                                localStorage.removeItem('ai_studio_loader');
                                                window.location.reload();
                                            }
                                        }}
                                    >
                                        <i className="fa-solid fa-trash-can"></i> Reset App Data & Cache
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>
</html>
