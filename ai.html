<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Studio</title>
    <!-- Favicon inline SVG -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%236366f1'/><path d='M30 50 L50 30 L70 50 L50 70 Z' fill='%23fff'/></svg>">
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons without external bundlers -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Marked & Highlight.js -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <!-- JSZip for multi-file downloads -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.2/jszip.min.js"></script>

    <!-- React 18 & Babel CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        :root {
            --bg-base: #0b0d13;
            --bg-subtle: #131722;
            --bg-surface: #1a2030;
            --border: rgba(255, 255, 255, 0.08);
            --border-active: rgba(99, 102, 241, 0.4);
            --primary: #6366f1;
            --accent: #06b6d4;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --text-faint: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text);
            font-family: 'Inter', -apple-system, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        #root {
            width: 100vw;
            height: 100vh;
            display: flex;
            position: relative;
        }

        .ambient-bg {
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(circle at 50% 0%, rgba(99, 102, 241, 0.12), transparent 50%),
                        radial-gradient(circle at 100% 100%, rgba(6, 182, 212, 0.08), transparent 40%);
            z-index: 0;
        }

        .layout {
            position: relative;
            z-index: 1;
            display: flex;
            width: 100%;
            height: 100%;
        }

        /* History Sidebar */
        .history-sidebar {
            width: 250px;
            background: #0d1017;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            transition: all 0.25s ease;
            z-index: 10;
        }

        .history-sidebar.collapsed {
            margin-left: -250px;
        }

        .history-header {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .history-item {
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.15s;
            text-overflow: ellipsis;
            white-space: nowrap;
            overflow: hidden;
        }

        .history-item:hover, .history-item.active {
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
        }

        /* Chat Pane */
        .chat-pane {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border);
            min-width: 380px;
        }

        /* Canvas Pane */
        .canvas-pane {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: #0f131b;
            min-width: 420px;
            animation: slideInRight 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .topbar {
            height: 54px;
            padding: 0 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(11, 13, 19, 0.85);
            backdrop-filter: blur(12px);
            gap: 12px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 0.95rem;
            color: #fff;
        }

        .btn-action {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--bg-subtle);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-action:hover {
            background: var(--bg-surface);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .btn-primary {
            background: var(--primary);
            border-color: var(--primary);
            color: #fff;
            font-weight: 500;
        }

        .btn-primary:hover {
            background: #4f46e5;
        }

        .chat-stream {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .chat-stream::-webkit-scrollbar,
        .history-list::-webkit-scrollbar,
        .preview-body::-webkit-scrollbar {
            width: 6px;
        }

        .chat-stream::-webkit-scrollbar-thumb,
        .history-list::-webkit-scrollbar-thumb,
        .preview-body::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.12);
            border-radius: 10px;
        }

        .msg-bubble {
            max-width: 820px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            gap: 12px;
        }

        .msg-bubble.user {
            justify-content: flex-end;
        }

        .msg-content {
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.92rem;
            line-height: 1.6;
            word-break: break-word;
        }

        .msg-bubble.user .msg-content {
            background: #4338ca;
            color: #fff;
            border-bottom-right-radius: 2px;
            max-width: 75%;
        }

        .msg-bubble.ai .msg-content {
            background: var(--bg-subtle);
            border: 1px solid var(--border);
            color: var(--text);
            flex: 1;
            border-bottom-left-radius: 2px;
        }

        .msg-content pre {
            background: #090c12;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            margin: 10px 0;
            overflow-x: auto;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.84rem;
        }

        .msg-content code {
            font-family: 'JetBrains Mono', monospace;
            background: rgba(255, 255, 255, 0.08);
            padding: 2px 5px;
            border-radius: 4px;
            font-size: 0.86em;
        }

        .msg-content pre code {
            background: transparent;
            padding: 0;
        }

        .msg-content p:not(:last-child) {
            margin-bottom: 10px;
        }

        .spotlight-card {
            background: rgba(19, 23, 34, 0.7);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px 18px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .spotlight-card:hover {
            border-color: var(--border-active);
            transform: translateY(-2px);
            background: rgba(26, 32, 48, 0.85);
        }

        .shiny-text {
            background: linear-gradient(
                120deg,
                rgba(255, 255, 255, 0.5) 0%,
                rgba(255, 255, 255, 1) 50%,
                rgba(99, 102, 241, 1) 60%,
                rgba(255, 255, 255, 0.5) 100%
            );
            background-size: 200% auto;
            color: #fff;
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 4s linear infinite;
        }

        @keyframes shine {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        .input-bar {
            padding: 14px 24px 20px;
            background: var(--bg-base);
            border-top: 1px solid var(--border);
        }

        .input-wrap {
            max-width: 820px;
            margin: 0 auto;
            background: var(--bg-subtle);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 6px 10px 6px 16px;
            display: flex;
            align-items: flex-end;
            gap: 10px;
            transition: border-color 0.2s;
        }

        .input-wrap:focus-within {
            border-color: var(--primary);
        }

        .text-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-family: inherit;
            font-size: 0.93rem;
            resize: none;
            min-height: 38px;
            max-height: 160px;
            line-height: 1.5;
            padding: 8px 0;
        }

        .text-input::placeholder {
            color: var(--text-faint);
        }

        .send-btn {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: var(--primary);
            border: none;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.15s, opacity 0.15s;
        }

        .send-btn:hover:not(:disabled) {
            transform: scale(1.05);
        }

        .send-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .canvas-header {
            height: 54px;
            padding: 0 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-subtle);
        }

        .tabs {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            max-width: 60%;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .tab-btn.active {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            font-weight: 500;
        }

        .preview-body {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #fff;
        }

        .preview-iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #ffffff;
        }

        .code-view {
            width: 100%;
            height: 100%;
            background: #090c12;
            color: #cbd5e1;
            padding: 16px;
            overflow: auto;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.84rem;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .pill-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 8px;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .download-bar {
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .cursor-blink {
            display: inline-block;
            width: 2px;
            height: 1.1em;
            background: var(--accent);
            margin-left: 2px;
            vertical-align: middle;
            animation: blink 0.8s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* ===== CallChip Loader Styles ===== */
        .call-chip {
            --cc-size: 34px;
            --cc-font: 13px;
            --cc-pad: 12px;
            --cc-gap: 7px;
            --cc-radius: 10px;
            --cc-color: currentColor;
            --cc-surface: #27272a;
            --cc-progress: currentColor;
            --cc-progress-pct: 8%;
            --cc-done: #22c55e;
            --cc-error: #ef4444;
            --cc-wash-pct: 14%;
            --cc-expected: 2500ms;
            --cc-ease-out: cubic-bezier(0.23, 1, 0.32, 1);

            position: relative;
            display: inline-flex;
            align-items: center;
            gap: var(--cc-gap);
            box-sizing: border-box;
            height: var(--cc-size);
            padding: 0 var(--cc-pad);
            border-radius: var(--cc-radius);
            overflow: hidden;
            background: var(--cc-surface);
            color: var(--cc-color);
            font-size: var(--cc-font);
            line-height: 1;
            white-space: nowrap;
            user-select: none;
            transition: transform 160ms var(--cc-ease-out);
        }

        .call-chip[data-status='error'] { cursor: pointer; }
        .call-chip[data-pressed] { transform: scale(0.97); }

        .call-chip__fill {
            position: absolute;
            inset: 0;
            background: color-mix(in srgb, var(--cc-progress) var(--cc-progress-pct), transparent);
            transform: scaleX(0);
            transform-origin: left center;
            clip-path: inset(0 0 0 0);
            pointer-events: none;
        }

        .call-chip[data-status='running'] .call-chip__fill {
            transition: transform var(--cc-expected) linear;
        }

        .call-chip[data-status='done'] .call-chip__fill {
            background: color-mix(in srgb, var(--cc-done) var(--cc-wash-pct), transparent);
            clip-path: inset(100% 0 0 0);
            transition: transform 200ms var(--cc-ease-out), background-color 120ms ease, clip-path 400ms var(--cc-ease-out) 200ms;
        }

        .call-chip[data-status='error'] .call-chip__fill {
            background: color-mix(in srgb, var(--cc-error) var(--cc-wash-pct), transparent);
            transition: background-color 200ms ease;
        }

        .call-chip__slot {
            position: relative;
            flex: none;
            width: calc(var(--cc-font) + 2px);
            height: calc(var(--cc-font) + 2px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .call-chip__name { font-weight: 500; }
        .call-chip__arg { opacity: 0.72; }
        .call-chip__timer { min-width: 5ch; font-variant-numeric: tabular-nums; text-align: right; opacity: 0.5; }

        /* ===== GlideSelect Styles ===== */
        .glide-select {
            --gs-accent: #f5f5f5;
            --gs-surface: #27272a;
            --gs-highlight: #3f3f46;
            --gs-text: #f5f5f5;
            --gs-radius: 10px;
            --gs-inner-radius: 6px;
            --gs-chip: 32px;
            --gs-row: 30px;
            --gs-font: 13px;
            --gs-menu-w: 240px;
            --gs-pop: 180ms;
            --gs-pop-out: 120ms;
            --gs-glide: 220ms;
            --gs-ease-out: cubic-bezier(0.23, 1, 0.32, 1);
            position: relative;
            display: inline-block;
        }

        .glide-select__trigger {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            height: var(--gs-chip);
            padding: 0 10px 0 12px;
            border: 0;
            border-radius: var(--gs-inner-radius);
            background: var(--gs-surface);
            color: var(--gs-text);
            font-family: inherit;
            font-size: var(--gs-font);
            font-weight: 500;
            line-height: 1;
            cursor: pointer;
            outline: none;
            user-select: none;
            transition: background-color 100ms ease, transform 160ms var(--gs-ease-out);
        }

        .glide-select__trigger:hover {
            background: color-mix(in srgb, var(--gs-highlight) 60%, var(--gs-surface));
        }

        .glide-select__menu {
            position: absolute;
            z-index: 50;
            width: var(--gs-menu-w);
            min-width: 100%;
            top: calc(100% + 6px);
            left: 0;
            max-height: 320px;
            overflow-y: auto;
            padding: 4px;
            border-radius: var(--gs-radius);
            background: var(--gs-surface);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border);
            animation: popIn 180ms var(--gs-ease-out);
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .glide-select__option {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            height: var(--gs-row);
            padding: 0 10px;
            border-radius: var(--gs-inner-radius);
            color: var(--gs-text);
            font-size: var(--gs-font);
            cursor: pointer;
            transition: background-color 150ms ease;
        }

        .glide-select__option:hover, .glide-select__option[aria-selected='true'] {
            background: var(--gs-highlight);
        }

        /* ===== StatusMark Styles ===== */
        .status-mark {
            --sm-size: 18px;
            --sm-stroke: 2;
            --sm-color: currentColor;
            --sm-done: #22c55e;
            --sm-error: #ef4444;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            line-height: 1;
        }
        .status-mark__glyph { color: var(--sm-color); }
        .status-mark[data-status='done'] .status-mark__glyph { color: var(--sm-done); }
        .status-mark[data-status='failed'] .status-mark__glyph { color: var(--sm-error); }
        .status-mark[data-status='running'] .status-mark__ring {
            animation: spin 1s linear infinite;
            transform-origin: 12px 12px;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="module">
        import * as webllm from "https://esm.run/@mlc-ai/web-llm@0.2.85";
        window.webllm = webllm;

        if (navigator.storage && navigator.storage.persist) {
            navigator.storage.persist().catch(() => {});
        }

        window.dispatchEvent(new CustomEvent('webllm-ready'));
    </script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // ===== ReactBits CallChip Component =====
        function CallChip({
            name = 'webllm',
            argument = 'load',
            status = 'running',
            expectedMs = 2500,
            onRetry
        }) {
            const [ms, setMs] = useState(0);
            const fillRef = useRef(null);

            useEffect(() => {
                if (status !== 'running') return;
                const start = performance.now();
                const interval = setInterval(() => {
                    setMs(Math.round(performance.now() - start));
                }, 50);
                return () => clearInterval(interval);
            }, [status]);

            useEffect(() => {
                const fill = fillRef.current;
                if (!fill) return;
                if (status === 'running') {
                    fill.style.transition = `transform ${expectedMs}ms linear`;
                    fill.style.transform = 'scaleX(0.9)';
                } else if (status === 'done') {
                    fill.style.transition = 'transform 200ms ease';
                    fill.style.transform = 'scaleX(1)';
                } else {
                    fill.style.transform = 'scaleX(0)';
                }
            }, [status, expectedMs]);

            return (
                <span className="call-chip" data-status={status}>
                    <span ref={fillRef} className="call-chip__fill" />
                    <span className="call-chip__slot">
                        {status === 'running' && <i className="fa-solid fa-circle-notch fa-spin"></i>}
                        {status === 'done' && <i className="fa-solid fa-check" style={{ color: '#22c55e' }}></i>}
                        {status === 'error' && <i className="fa-solid fa-rotate-right" style={{ color: '#ef4444' }}></i>}
                    </span>
                    <span className="call-chip__name">{name}</span>
                    <span className="call-chip__arg">{argument}</span>
                    <span className="call-chip__timer">{ms < 10000 ? `${ms} ms` : `${(ms/1000).toFixed(1)} s`}</span>
                </span>
            );
        }

        // ===== ReactBits GlideSelect Component =====
        function GlideSelect({ options = [], value, onChange, disabled }) {
            const [open, setOpen] = useState(false);
            const menuRef = useRef(null);

            useEffect(() => {
                const onDown = (e) => {
                    if (menuRef.current && !menuRef.current.contains(e.target)) {
                        setOpen(false);
                    }
                };
                if (open) document.addEventListener('pointerdown', onDown);
                return () => document.removeEventListener('pointerdown', onDown);
            }, [open]);

            const current = options.find(o => o.value === value) || options[0];

            return (
                <div className="glide-select" ref={menuRef}>
                    <button 
                        type="button"
                        className="glide-select__trigger" 
                        onClick={() => !disabled && setOpen(!open)}
                        disabled={disabled}
                    >
                        <span>{current ? current.label : 'Select Model'}</span>
                        <i className={`fa-solid fa-chevron-down ${open ? 'fa-rotate-180' : ''}`} style={{ fontSize: 11, transition: 'transform 0.2s' }}></i>
                    </button>
                    {open && (
                        <div className="glide-select__menu">
                            {options.map(opt => (
                                <div 
                                    key={opt.value}
                                    className="glide-select__option"
                                    aria-selected={opt.value === value}
                                    onClick={() => {
                                        onChange(opt.value);
                                        setOpen(false);
                                    }}
                                >
                                    <span style={{ fontWeight: 500, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                                        {opt.label}
                                    </span>
                                    {opt.tag && <span style={{ fontSize: 10, color: 'var(--text-faint)' }}>{opt.tag}</span>}
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        }

        // ===== ReactBits StatusMark Component =====
        function StatusMark({ status = 'running', label }) {
            return (
                <span className="status-mark" data-status={status}>
                    <svg className="status-mark__glyph" viewBox="0 0 24 24" width="18" height="18">
                        <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" strokeWidth="2" opacity="0.2" />
                        {status === 'running' && (
                            <circle className="status-mark__ring" cx="12" cy="12" r="9" fill="none" stroke="currentColor" strokeWidth="2" strokeDasharray="14 40" strokeLinecap="round" />
                        )}
                        {status === 'done' && (
                            <path d="M7 12 l3.5 3.5 l7 -7" fill="none" stroke="#22c55e" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" />
                        )}
                        {status === 'failed' && (
                            <path d="M8 8 l8 8 M16 8 l-8 8" fill="none" stroke="#ef4444" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" />
                        )}
                    </svg>
                    {label && <span style={{ fontSize: 13, color: status === 'done' ? '#22c55e' : status === 'failed' ? '#ef4444' : 'inherit' }}>{label}</span>}
                </span>
            );
        }

        // Extracts all virtual files from assistant text
        function parseVirtualFiles(content) {
            if (!content) return { files: {}, hasCode: false };
            const files = {};
            let hasCode = false;

            const codeBlockRegex = /```([a-zA-Z0-9_-]+)?(?:\s+(?:filename=)?["']?([a-zA-Z0-9_.-]+)["']?)?\s*\n([\s\S]*?)(?:```|$)/g;
            let match;
            let defaultIndex = 1;

            while ((match = codeBlockRegex.exec(content)) !== null) {
                const lang = (match[1] || '').toLowerCase();
                let explicitName = match[2];
                const code = match[3];

                if (!code && !lang) continue;
                hasCode = true;

                if (!explicitName) {
                    const headerComment = code.slice(0, 100).match(/(?:<!--|\/\*|\/\/)\s*([a-zA-Z0-9_.-]+\.(html|css|js|jsx|json|ts|svg))\s*(?:-->|\*\/)?/i);
                    if (headerComment && headerComment[1]) {
                        explicitName = headerComment[1].trim();
                    }
                }

                if (!explicitName) {
                    if (lang === 'html' || code.includes('<html') || code.includes('<!DOCTYPE') || code.includes('<body') || code.includes('<div') || code.includes('<canvas')) {
                        explicitName = 'index.html';
                    } else if (lang === 'css' || (code.includes('{') && code.includes('margin:'))) {
                        explicitName = Object.keys(files).some(k => k.endsWith('.css')) ? `style${defaultIndex++}.css` : 'style.css';
                    } else if (lang === 'js' || lang === 'javascript') {
                        explicitName = Object.keys(files).some(k => k.endsWith('.js')) ? `script${defaultIndex++}.js` : 'script.js';
                    } else {
                        explicitName = `file${defaultIndex++}.${lang || 'txt'}`;
                    }
                }

                files[explicitName] = code.trim();
            }

            if (!hasCode && (content.includes('<!DOCTYPE html') || content.includes('<html') || content.includes('```html'))) {
                hasCode = true;
                const clean = content.replace(/```html?/i, '').replace(/```$/, '').trim();
                files['index.html'] = clean;
            }

            return { files, hasCode };
        }

        // Bundles multi-file virtual directory into an execution-safe document
        function bundleMultiFiles(files, isStreaming = false) {
            const fileKeys = Object.keys(files);
            if (fileKeys.length === 0) return "";

            let mainHtml = files['index.html'] || files[fileKeys.find(k => k.endsWith('.html'))] || "";

            const endScriptTag = '<' + '/script>';
            const endStyleTag = '<' + '/style>';

            // While actively streaming, strip incomplete/unclosed <script tags from iframe to avoid SyntaxErrors
            let safeHtml = mainHtml;
            if (isStreaming) {
                safeHtml = safeHtml.replace(/<script\b[^<]*(?:(?!<\/script>)<[^<]*)*$/i, '');
            }

            if (!safeHtml) {
                const css = files['style.css'] || files[fileKeys.find(k => k.endsWith('.css'))] || "";
                const js = !isStreaming ? (files['script.js'] || files[fileKeys.find(k => k.endsWith('.js'))] || "") : "";
                return '<!DOCTYPE html><html><head><meta charset="utf-8"><style>' + css + endStyleTag + '</head><body><script>' + js + endScriptTag + '</body></html>';
            }

            // Inline external CSS links
            safeHtml = safeHtml.replace(/<link\s+[^>]*href=["']([^"']+\.css)["'][^>]*>/gi, (tag, href) => {
                const baseName = href.split('/').pop();
                if (files[baseName]) {
                    return '<style>/* ' + baseName + ' */\n' + files[baseName] + '\n' + endStyleTag;
                }
                return tag;
            });

            // Inline external JS scripts (only when not streaming incomplete scripts)
            safeHtml = safeHtml.replace(/<script\s+[^>]*src=["']([^"']+\.js)["'][^>]*>\s*<\/script>/gi, (tag, src) => {
                const baseName = src.split('/').pop();
                if (files[baseName] && !isStreaming) {
                    return '<script>/* ' + baseName + ' */\n' + files[baseName] + '\n' + endScriptTag;
                }
                return '';
            });

            // Append any unlinked CSS
            for (const [k, code] of Object.entries(files)) {
                if (k.endsWith('.css') && !safeHtml.includes(code)) {
                    safeHtml += '\n<style>/* ' + k + ' */\n' + code + '\n' + endStyleTag;
                }
            }

            // Append unlinked JS only when generation completes
            if (!isStreaming) {
                for (const [k, code] of Object.entries(files)) {
                    if (k.endsWith('.js') && !safeHtml.includes(code)) {
                        safeHtml += '\n<script>/* ' + k + ' */\n' + code + '\n' + endScriptTag;
                    }
                }
            }

            return safeHtml;
        }

        function App() {
            const [models, setModels] = useState([]);
            const [selectedModel, setSelectedModel] = useState("");
            const [engineReady, setEngineReady] = useState(false);
            const [loadingState, setLoadingState] = useState({ active: false, text: "", progress: 0 });
            const [isGenerating, setIsGenerating] = useState(false);
            const [totalTokens, setTotalTokens] = useState(0);

            // Chat History System
            const [sessions, setSessions] = useState(() => {
                try {
                    const saved = localStorage.getItem('ai_studio_sessions');
                    return saved ? JSON.parse(saved) : [{ id: 'default', title: 'New Chat', messages: [], files: {} }];
                } catch (e) {
                    return [{ id: 'default', title: 'New Chat', messages: [], files: {} }];
                }
            });
            const [currentSessionId, setCurrentSessionId] = useState('default');
            const [historyOpen, setHistoryOpen] = useState(false);

            const [input, setInput] = useState("");
            const [virtualFiles, setVirtualFiles] = useState({});
            const [activeFileTab, setActiveFileTab] = useState("preview");
            const [showCanvas, setShowCanvas] = useState(false);

            const engineRef = useRef(null);
            const streamEndRef = useRef(null);
            const inputRef = useRef(null);
            const iframeRef = useRef(null);

            const activeSession = sessions.find(s => s.id === currentSessionId) || sessions[0];
            const messages = activeSession ? activeSession.messages : [];

            // Save history
            useEffect(() => {
                try {
                    localStorage.setItem('ai_studio_sessions', JSON.stringify(sessions));
                } catch (e) {}
            }, [sessions]);

            // Populate all models dynamically & prefetch tiny demo model wasm
            useEffect(() => {
                const initModels = () => {
                    if (window.webllm && window.webllm.prebuiltAppConfig) {
                        const list = window.webllm.prebuiltAppConfig.model_list.map(m => ({
                            value: m.model_id,
                            label: m.model_id.replace('-MLC', '').replace('-Instruct', ''),
                            tag: m.vram_required_MB ? `${(m.vram_required_MB / 1024).toFixed(1)}GB` : ''
                        }));
                        setModels(list);

                        const defaultChoice = list.find(m => m.value.includes("SmolLM2-135M") || m.value.includes("Llama-3.2-1B")) || list[0];
                        if (defaultChoice) setSelectedModel(defaultChoice.value);

                        if ('requestIdleCallback' in window) {
                            window.requestIdleCallback(() => {
                                const tinyModel = window.webllm.prebuiltAppConfig.model_list.find(m => m.model_id.includes("SmolLM2-135M"));
                                if (tinyModel && tinyModel.model_lib) {
                                    fetch(tinyModel.model_lib, { mode: 'cors', cache: 'force-cache' }).catch(() => {});
                                }
                            });
                        }
                    }
                };

                window.addEventListener('webllm-ready', initModels);
                initModels();
                return () => window.removeEventListener('webllm-ready', initModels);
            }, []);

            useEffect(() => {
                streamEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [messages, isGenerating]);

            const loadModel = async (modelId) => {
                if (!window.webllm) return;
                try {
                    setLoadingState({ active: true, text: "Compiling WebGPU pipeline...", progress: 0.05 });
                    setEngineReady(false);

                    if (engineRef.current) {
                        await engineRef.current.unload();
                    }

                    const engine = await window.webllm.CreateMLCEngine(modelId, {
                        initProgressCallback: (report) => {
                            setLoadingState({
                                active: true,
                                text: report.text || "Loading weights...",
                                progress: report.progress || 0.1
                            });
                        }
                    });

                    engineRef.current = engine;
                    setEngineReady(true);
                    setLoadingState({ active: false, text: "Ready", progress: 1 });
                } catch (err) {
                    console.error("WebLLM Init Error:", err);
                    alert("Could not load model: " + (err.message || err));
                    setLoadingState({ active: false, text: "", progress: 0 });
                }
            };

            const updateSessionMessages = (newMsgs, newFiles) => {
                setSessions(prev => prev.map(s => {
                    if (s.id === currentSessionId) {
                        let title = s.title;
                        if (title === 'New Chat' && newMsgs.length > 0) {
                            title = newMsgs[0].content.slice(0, 24) + '...';
                        }
                        return { ...s, title, messages: newMsgs, files: newFiles || s.files };
                    }
                    return s;
                }));
            };

            const createNewSession = () => {
                const newId = 'session_' + Date.now();
                const newSession = { id: newId, title: 'New Chat', messages: [], files: {} };
                setSessions([newSession, ...sessions]);
                setCurrentSessionId(newId);
                setVirtualFiles({});
                setShowCanvas(false);
            };

            const deleteSession = (e, id) => {
                e.stopPropagation();
                if (sessions.length <= 1) {
                    createNewSession();
                    return;
                }
                const filtered = sessions.filter(s => s.id !== id);
                setSessions(filtered);
                if (currentSessionId === id) {
                    setCurrentSessionId(filtered[0].id);
                    setVirtualFiles(filtered[0].files || {});
                }
            };

            const handleSend = async () => {
                const prompt = input.trim();
                if (!prompt || isGenerating) return;

                if (!engineReady || !engineRef.current) {
                    await loadModel(selectedModel);
                    if (!engineRef.current) return;
                }

                const userMsg = { role: "user", content: prompt };
                const newMessages = [...messages, userMsg];
                updateSessionMessages(newMessages);
                setInput("");
                setIsGenerating(true);

                const aiId = Date.now();
                const withAiPlaceholder = [...newMessages, { role: "assistant", content: "", id: aiId, files: {} }];
                updateSessionMessages(withAiPlaceholder);

                try {
                    const systemMsg = {
                        role: "system",
                        content: "You are an expert full-stack coder. Provide clean, modern code. Default to a single-file implementation (HTML with inline CSS and JS) unless the user requests multiple files or separating them into index.html, style.css, and script.js is cleaner. When using multiple files, prefix each code block with its filename (e.g. ```html index.html or ```css style.css)."
                    };

                    const asyncChunks = await engineRef.current.chat.completions.create({
                        messages: [systemMsg, ...newMessages.map(m => ({ role: m.role, content: m.content }))],
                        stream: true,
                        temperature: 0.7
                    });

                    let fullText = "";
                    let currentTokens = 0;
                    let canvasPopped = false;

                    for await (const chunk of asyncChunks) {
                        const delta = chunk.choices[0]?.delta?.content || "";
                        fullText += delta;
                        currentTokens++;

                        setTotalTokens(prev => prev + 1);

                        if (!canvasPopped && (fullText.includes("```") || fullText.includes("<!DOCTYPE") || fullText.includes("<html"))) {
                            setShowCanvas(true);
                            canvasPopped = true;
                        }

                        const { files, hasCode } = parseVirtualFiles(fullText);
                        if (hasCode) {
                            setVirtualFiles(files);
                        }

                        const updatedAiMsgs = withAiPlaceholder.map(m => 
                            m.id === aiId ? { ...m, content: fullText, tokens: currentTokens, files } : m
                        );
                        updateSessionMessages(updatedAiMsgs, files);
                    }
                } catch (err) {
                    console.error("Inference Error:", err);
                    updateSessionMessages(
                        withAiPlaceholder.map(m => m.id === aiId ? { ...m, content: fullText + "\n\nError: " + (err.message || err) } : m)
                    );
                } finally {
                    setIsGenerating(false);
                }
            };

            const handleKeyDown = (e) => {
                if (e.key === "Enter" && !e.shiftKey) {
                    e.preventDefault();
                    handleSend();
                }
            };

            const renderMarkdown = (content) => {
                if (!content) return { __html: "" };
                try {
                    return { __html: marked.parse(content) };
                } catch (e) {
                    return { __html: content };
                }
            };

            const handleDownload = async (files) => {
                const keys = Object.keys(files);
                if (keys.length === 0) return;

                if (keys.length === 1 && keys[0].endsWith('.html')) {
                    const blob = new Blob([files[keys[0]]], { type: 'text/html;charset=utf-8' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = keys[0] || 'index.html';
                    a.click();
                    URL.revokeObjectURL(url);
                } else {
                    if (!window.JSZip) {
                        alert("ZIP library not loaded");
                        return;
                    }
                    const zip = new window.JSZip();
                    for (const [name, content] of Object.entries(files)) {
                        zip.file(name, content);
                    }
                    const zipBlob = await zip.generateAsync({ type: 'blob' });
                    const url = URL.createObjectURL(zipBlob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'website.zip';
                    a.click();
                    URL.revokeObjectURL(url);
                }
            };

            const compiledHtml = bundleMultiFiles(virtualFiles, isGenerating);

            return (
                <div className="layout">
                    <div className="ambient-bg"></div>

                    {/* Chat History Sidebar */}
                    <aside className={`history-sidebar ${historyOpen ? '' : 'collapsed'}`}>
                        <div className="history-header">
                            <span>Chat History</span>
                            <button className="btn-action" onClick={createNewSession} title="New Chat">
                                <i className="fa-solid fa-plus"></i>
                            </button>
                        </div>
                        <div className="history-list">
                            {sessions.map(s => (
                                <div 
                                    key={s.id}
                                    className={`history-item ${s.id === currentSessionId ? 'active' : ''}`}
                                    onClick={() => {
                                        setCurrentSessionId(s.id);
                                        setVirtualFiles(s.files || {});
                                        setShowCanvas(Object.keys(s.files || {}).length > 0);
                                    }}
                                >
                                    <span style={{ overflow: 'hidden', textOverflow: 'ellipsis' }}>{s.title}</span>
                                    <i 
                                        className="fa-solid fa-xmark" 
                                        style={{ fontSize: 11, opacity: 0.5 }} 
                                        onClick={(e) => deleteSession(e, s.id)}
                                        title="Delete"
                                    ></i>
                                </div>
                            ))}
                        </div>
                    </aside>

                    <div className="chat-pane">
                        <header className="topbar">
                            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                                <button 
                                    className="btn-action" 
                                    onClick={() => setHistoryOpen(!historyOpen)}
                                    title="Toggle History"
                                >
                                    <i className="fa-solid fa-clock-rotate-left"></i>
                                </button>
                                <div className="brand">
                                    <StatusMark status={engineReady ? 'done' : loadingState.active ? 'running' : 'failed'} />
                                    <span>AI Studio</span>
                                </div>
                            </div>

                            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                                {/* GlideSelect Model Dropdown */}
                                <GlideSelect 
                                    options={models}
                                    value={selectedModel}
                                    onChange={(val) => {
                                        setSelectedModel(val);
                                        setEngineReady(false);
                                    }}
                                    disabled={loadingState.active || isGenerating}
                                />

                                {!engineReady ? (
                                    <button 
                                        className="btn-action btn-primary"
                                        onClick={() => loadModel(selectedModel)}
                                        disabled={loadingState.active}
                                    >
                                        <i className="fa-solid fa-bolt"></i>
                                        <span>Load</span>
                                    </button>
                                ) : (
                                    <span className="pill-badge" style={{ color: "#22c55e" }}>
                                        <i className="fa-solid fa-check"></i> Ready
                                    </span>
                                )}

                                {totalTokens > 0 && (
                                    <span className="pill-badge">
                                        <i className="fa-solid fa-bolt" style={{ color: "var(--accent)" }}></i> {totalTokens.toLocaleString()} tokens
                                    </span>
                                )}

                                {Object.keys(virtualFiles).length > 0 && !showCanvas && (
                                    <button 
                                        className="btn-action" 
                                        onClick={() => setShowCanvas(true)}
                                        title="Show canvas"
                                    >
                                        <i className="fa-solid fa-desktop"></i> Canvas
                                    </button>
                                )}
                            </div>
                        </header>

                        <div className="chat-stream">
                            {/* CallChip Loader during model loading or generation */}
                            {loadingState.active && (
                                <div style={{ display: "flex", justifyContent: "center", margin: "10px 0" }}>
                                    <CallChip 
                                        name="webllm" 
                                        argument={selectedModel.split('-')[0]} 
                                        status="running" 
                                        expectedMs={3500} 
                                    />
                                </div>
                            )}

                            {messages.length === 0 ? (
                                <div style={{ margin: "auto", textAlign: "center", maxWidth: 440, padding: 20 }}>
                                    <h2 style={{ fontSize: "1.4rem", fontWeight: 700, marginBottom: 8 }}>
                                        Private <span className="shiny-text">WebLLM</span> Chat
                                    </h2>
                                    <p style={{ color: "var(--text-muted)", fontSize: "0.88rem", marginBottom: 24, lineHeight: 1.5 }}>
                                        Runs locally via WebGPU. Prompt below to chat or generate real-time web pages.
                                    </p>

                                    <div style={{ display: "flex", flexDirection: "column", gap: 10, textAlign: "left" }}>
                                        <div 
                                            className="spotlight-card"
                                            onClick={() => { setInput("Create a neon particle simulation using HTML5 canvas."); inputRef.current?.focus(); }}
                                        >
                                            <div style={{ fontWeight: 600, fontSize: "0.85rem", color: "#fff", marginBottom: 2 }}>
                                                Interactive Canvas
                                            </div>
                                            <div style={{ fontSize: "0.78rem", color: "var(--text-muted)" }}>
                                                "Create a neon particle simulation using HTML5 canvas"
                                            </div>
                                        </div>

                                        <div 
                                            className="spotlight-card"
                                            onClick={() => { setInput("Build a modern stopwatch web app with lap times in HTML, CSS, and JS."); inputRef.current?.focus(); }}
                                        >
                                            <div style={{ fontWeight: 600, fontSize: "0.85rem", color: "#fff", marginBottom: 2 }}>
                                                Live Mini App
                                            </div>
                                            <div style={{ fontSize: "0.78rem", color: "var(--text-muted)" }}>
                                                "Build a modern stopwatch web app with lap times"
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            ) : (
                                messages.map((m, idx) => (
                                    <div key={idx} className={`msg-bubble ${m.role === 'user' ? 'user' : 'ai'}`}>
                                        <div className="msg-content">
                                            {m.role === 'user' ? (
                                                m.content
                                            ) : (
                                                <div>
                                                    <div dangerouslySetInnerHTML={renderMarkdown(m.content)} />
                                                    {isGenerating && idx === messages.length - 1 && (
                                                        <span className="cursor-blink"></span>
                                                    )}
                                                    
                                                    <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginTop: 8 }}>
                                                        {m.tokens > 0 && (
                                                            <div style={{ fontSize: "0.72rem", color: "var(--text-faint)", display: "flex", alignItems: "center", gap: 4 }}>
                                                                <i className="fa-solid fa-coins"></i> {m.tokens.toLocaleString()} tokens
                                                            </div>
                                                        )}

                                                        {m.files && Object.keys(m.files).length > 0 && (
                                                            <div className="download-bar">
                                                                <button 
                                                                    className="btn-action"
                                                                    onClick={() => handleDownload(m.files)}
                                                                    title="Download generated website files"
                                                                >
                                                                    <i className="fa-solid fa-download"></i>
                                                                    <span>Download Website ({Object.keys(m.files).length > 1 ? "ZIP" : "HTML"})</span>
                                                                </button>
                                                            </div>
                                                        )}
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                ))
                            )}
                            <div ref={streamEndRef} />
                        </div>

                        <div className="input-bar">
                            <div className="input-wrap">
                                <textarea
                                    ref={inputRef}
                                    className="text-input"
                                    placeholder={engineReady ? "Ask or code anything... (Enter to send)" : "Click 'Load' to start..."}
                                    value={input}
                                    onChange={(e) => setInput(e.target.value)}
                                    onKeyDown={handleKeyDown}
                                    rows="1"
                                />

                                <button
                                    className="send-btn"
                                    onClick={handleSend}
                                    disabled={!input.trim() || isGenerating}
                                    title="Send"
                                >
                                    {isGenerating ? (
                                        <i className="fa-solid fa-spinner fa-spin"></i>
                                    ) : (
                                        <i className="fa-solid fa-arrow-up"></i>
                                    )}
                                </button>
                            </div>
                        </div>
                    </div>

                    {/* Live Canvas / Multi-file Workspace Pane */}
                    {showCanvas && Object.keys(virtualFiles).length > 0 && (
                        <div className="canvas-pane">
                            <div className="canvas-header">
                                <div className="tabs">
                                    <button 
                                        className={`tab-btn ${activeFileTab === 'preview' ? 'active' : ''}`}
                                        onClick={() => setActiveFileTab('preview')}
                                    >
                                        <i className="fa-solid fa-play"></i> Live Preview
                                    </button>
                                    {Object.keys(virtualFiles).map(name => (
                                        <button 
                                            key={name}
                                            className={`tab-btn ${activeFileTab === name ? 'active' : ''}`}
                                            onClick={() => setActiveFileTab(name)}
                                        >
                                            <i className={name.endsWith('.css') ? 'fa-brands fa-css3-alt' : name.endsWith('.js') ? 'fa-brands fa-js' : 'fa-brands fa-html5'}></i> {name}
                                        </button>
                                    ))}
                                </div>

                                <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
                                    <button 
                                        className="btn-action"
                                        onClick={() => handleDownload(virtualFiles)}
                                        title="Download All Files"
                                    >
                                        <i className="fa-solid fa-download"></i>
                                    </button>
                                    <button 
                                        className="btn-action"
                                        onClick={() => {
                                            if (iframeRef.current) {
                                                iframeRef.current.srcdoc = bundleMultiFiles(virtualFiles, false);
                                            }
                                        }}
                                        title="Refresh preview"
                                    >
                                        <i className="fa-solid fa-rotate-right"></i>
                                    </button>
                                    <button 
                                        className="btn-action"
                                        onClick={() => setShowCanvas(false)}
                                        title="Close"
                                    >
                                        <i className="fa-solid fa-xmark"></i>
                                    </button>
                                </div>
                            </div>

                            <div className="preview-body">
                                {activeFileTab === 'preview' ? (
                                    <iframe 
                                        ref={iframeRef}
                                        className="preview-iframe" 
                                        srcDoc={compiledHtml}
                                        sandbox="allow-scripts allow-modals"
                                    />
                                ) : (
                                    <pre className="code-view">
                                        <code>{virtualFiles[activeFileTab]}</code>
                                    </pre>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>
</html>
