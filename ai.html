<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Studio</title>
    <!-- Favicon inline SVG -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2310b981'/><path d='M30 50 L50 30 L70 50 L50 70 Z' fill='%23fff'/></svg>">
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Marked & Highlight.js -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <!-- JSZip for multi-file downloads -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.2/jszip.min.js"></script>

    <!-- React 18 & Babel CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* Base Root Theme Variables */
        :root {
            --bg-base: #070d0a;
            --bg-subtle: #0e1712;
            --bg-surface: #14221a;
            --border: rgba(16, 185, 129, 0.12);
            --border-active: rgba(16, 185, 129, 0.45);
            --primary: #10b981;
            --primary-hover: #059669;
            --accent: #34d399;
            --text: #f0fdf4;
            --text-muted: #86efac;
            --text-faint: #4ade8099;
            --user-bubble: #065f46;
            --glow-1: rgba(16, 185, 129, 0.15);
            --glow-2: rgba(52, 211, 153, 0.1);
        }

        /* Theme Presets */
        body[data-theme='emerald'] {
            --bg-base: #070d0a;
            --bg-subtle: #0e1712;
            --bg-surface: #14221a;
            --border: rgba(16, 185, 129, 0.12);
            --border-active: rgba(16, 185, 129, 0.45);
            --primary: #10b981;
            --primary-hover: #059669;
            --accent: #34d399;
            --text: #f0fdf4;
            --text-muted: #86efac;
            --text-faint: #4ade8099;
            --user-bubble: #065f46;
            --glow-1: rgba(16, 185, 129, 0.15);
            --glow-2: rgba(52, 211, 153, 0.1);
        }

        body[data-theme='indigo'] {
            --bg-base: #0b0d13;
            --bg-subtle: #131722;
            --bg-surface: #1a2030;
            --border: rgba(99, 102, 241, 0.15);
            --border-active: rgba(99, 102, 241, 0.5);
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --accent: #06b6d4;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --text-faint: #64748b;
            --user-bubble: #4338ca;
            --glow-1: rgba(99, 102, 241, 0.18);
            --glow-2: rgba(6, 182, 212, 0.1);
        }

        body[data-theme='cyberpunk'] {
            --bg-base: #0f0714;
            --bg-subtle: #190e22;
            --bg-surface: #261533;
            --border: rgba(236, 72, 153, 0.2);
            --border-active: rgba(236, 72, 153, 0.55);
            --primary: #ec4899;
            --primary-hover: #db2777;
            --accent: #06b6d4;
            --text: #fdf2f8;
            --text-muted: #f472b6;
            --text-faint: #f472b688;
            --user-bubble: #831843;
            --glow-1: rgba(236, 72, 153, 0.18);
            --glow-2: rgba(6, 182, 212, 0.12);
        }

        body[data-theme='amber'] {
            --bg-base: #0f0c05;
            --bg-subtle: #1c150b;
            --bg-surface: #2b1f11;
            --border: rgba(245, 158, 11, 0.18);
            --border-active: rgba(245, 158, 11, 0.5);
            --primary: #f59e0b;
            --primary-hover: #d97706;
            --accent: #fbbf24;
            --text: #fffbeb;
            --text-muted: #fcd34d;
            --text-faint: #fcd34d88;
            --user-bubble: #78350f;
            --glow-1: rgba(245, 158, 11, 0.16);
            --glow-2: rgba(251, 191, 36, 0.1);
        }

        body[data-theme='obsidian'] {
            --bg-base: #09090b;
            --bg-subtle: #121215;
            --bg-surface: #1c1c21;
            --border: rgba(255, 255, 255, 0.1);
            --border-active: rgba(255, 255, 255, 0.35);
            --primary: #e4e4e7;
            --primary-hover: #d4d4d8;
            --accent: #a1a1aa;
            --text: #fafafa;
            --text-muted: #a1a1aa;
            --text-faint: #71717a;
            --user-bubble: #27272a;
            --glow-1: rgba(255, 255, 255, 0.05);
            --glow-2: rgba(255, 255, 255, 0.03);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text);
            font-family: 'Inter', -apple-system, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        #root {
            width: 100vw;
            height: 100vh;
            display: flex;
            position: relative;
        }

        .ambient-bg {
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(circle at 50% 0%, var(--glow-1), transparent 50%),
                        radial-gradient(circle at 100% 100%, var(--glow-2), transparent 40%);
            z-index: 0;
            transition: background 0.3s ease;
        }

        .layout {
            position: relative;
            z-index: 1;
            display: flex;
            width: 100%;
            height: 100%;
        }

        /* History Sidebar */
        .history-sidebar {
            width: 270px;
            background: var(--bg-subtle);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            transition: all 0.25s ease;
            z-index: 20;
        }

        .history-sidebar.collapsed {
            margin-left: -270px;
        }

        .history-header {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .history-item {
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.15s;
            text-overflow: ellipsis;
            white-space: nowrap;
            overflow: hidden;
        }

        .history-item:hover, .history-item.active {
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
        }

        /* Sidebar Bottom Settings Section */
        .sidebar-bottom {
            padding: 12px 14px;
            border-top: 1px solid var(--border);
            background: rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .sidebar-settings-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 0.82rem;
            font-weight: 500;
            cursor: pointer;
            padding: 6px 8px;
            border-radius: 8px;
            transition: all 0.2s;
            width: 100%;
        }

        .sidebar-settings-btn:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.08);
        }

        .sidebar-settings-btn i {
            transition: transform 0.5s ease;
        }

        .sidebar-settings-btn:hover i {
            transform: rotate(90deg);
            color: var(--primary);
        }

        /* Chat Pane */
        .chat-pane {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border);
            min-width: 380px;
        }

        /* Canvas Pane */
        .canvas-pane {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: var(--bg-surface);
            min-width: 420px;
            animation: slideInRight 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .topbar {
            height: 54px;
            padding: 0 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-base);
            backdrop-filter: blur(12px);
            gap: 12px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 0.95rem;
            color: #fff;
        }

        .btn-action {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--bg-subtle);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-action:hover {
            background: var(--bg-surface);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .btn-primary {
            background: var(--primary);
            border-color: var(--primary);
            color: #fff;
            font-weight: 500;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .chat-stream {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .chat-stream::-webkit-scrollbar,
        .history-list::-webkit-scrollbar,
        .preview-body::-webkit-scrollbar {
            width: 6px;
        }

        .chat-stream::-webkit-scrollbar-thumb,
        .history-list::-webkit-scrollbar-thumb,
        .preview-body::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.12);
            border-radius: 10px;
        }

        .msg-bubble {
            max-width: 820px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            gap: 12px;
        }

        .msg-bubble.user {
            justify-content: flex-end;
        }

        .msg-content {
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.92rem;
            line-height: 1.6;
            word-break: break-word;
        }

        .msg-bubble.user .msg-content {
            background: var(--user-bubble);
            color: #fff;
            border-bottom-right-radius: 2px;
            max-width: 75%;
        }

        .msg-bubble.ai .msg-content {
            background: var(--bg-subtle);
            border: 1px solid var(--border);
            color: var(--text);
            flex: 1;
            border-bottom-left-radius: 2px;
        }

        .msg-content pre {
            background: #090c12;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            margin: 10px 0;
            overflow-x: auto;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.84rem;
        }

        .msg-content code {
            font-family: 'JetBrains Mono', monospace;
            background: rgba(255, 255, 255, 0.08);
            padding: 2px 5px;
            border-radius: 4px;
            font-size: 0.86em;
        }

        .msg-content pre code {
            background: transparent;
            padding: 0;
        }

        .spotlight-card {
            background: var(--bg-subtle);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px 18px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .spotlight-card:hover {
            border-color: var(--border-active);
            transform: translateY(-2px);
            background: var(--bg-surface);
        }

        .shiny-text {
            background: linear-gradient(
                120deg,
                rgba(255, 255, 255, 0.5) 0%,
                rgba(255, 255, 255, 1) 50%,
                var(--primary) 60%,
                rgba(255, 255, 255, 0.5) 100%
            );
            background-size: 200% auto;
            color: #fff;
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 4s linear infinite;
        }

        @keyframes shine {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        .input-bar {
            padding: 14px 24px 20px;
            background: var(--bg-base);
            border-top: 1px solid var(--border);
        }

        .input-wrap {
            max-width: 820px;
            margin: 0 auto;
            background: var(--bg-subtle);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 6px 10px 6px 16px;
            display: flex;
            align-items: flex-end;
            gap: 10px;
            transition: border-color 0.2s;
        }

        .input-wrap:focus-within {
            border-color: var(--primary);
        }

        .text-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-family: inherit;
            font-size: 0.93rem;
            resize: none;
            min-height: 38px;
            max-height: 160px;
            line-height: 1.5;
            padding: 8px 0;
        }

        .text-input::placeholder {
            color: var(--text-faint);
        }

        .send-btn {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: var(--primary);
            border: none;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.15s, opacity 0.15s;
        }

        .send-btn:hover:not(:disabled) {
            transform: scale(1.05);
        }

        .send-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .canvas-header {
            height: 54px;
            padding: 0 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-subtle);
        }

        .tabs {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            max-width: 60%;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .tab-btn.active {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            font-weight: 500;
        }

        .preview-body {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #fff;
        }

        .preview-iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #ffffff;
        }

        .code-view {
            width: 100%;
            height: 100%;
            background: #090c12;
            color: #cbd5e1;
            padding: 16px;
            overflow: auto;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.84rem;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .pill-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 8px;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .download-bar {
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .cursor-blink {
            display: inline-block;
            width: 2px;
            height: 1.1em;
            background: var(--accent);
            margin-left: 2px;
            vertical-align: middle;
            animation: blink 0.8s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* ===== CallChip Loader Styles ===== */
        .call-chip {
            --cc-size: 34px;
            --cc-font: 13px;
            --cc-pad: 12px;
            --cc-gap: 7px;
            --cc-radius: 10px;
            --cc-color: currentColor;
            --cc-surface: #27272a;
            --cc-progress: currentColor;
            --cc-progress-pct: 8%;
            --cc-done: #22c55e;
            --cc-error: #ef4444;
            --cc-wash-pct: 14%;
            --cc-expected: 2500ms;
            --cc-ease-out: cubic-bezier(0.23, 1, 0.32, 1);

            position: relative;
            display: inline-flex;
            align-items: center;
            gap: var(--cc-gap);
            box-sizing: border-box;
            height: var(--cc-size);
            padding: 0 var(--cc-pad);
            border-radius: var(--cc-radius);
            overflow: hidden;
            background: var(--cc-surface);
            color: var(--cc-color);
            font-size: var(--cc-font);
            line-height: 1;
            white-space: nowrap;
            user-select: none;
            transition: transform 160ms var(--cc-ease-out);
        }

        .call-chip[data-status='error'] { cursor: pointer; }
        .call-chip[data-pressed] { transform: scale(0.97); }

        .call-chip__fill {
            position: absolute;
            inset: 0;
            background: color-mix(in srgb, var(--cc-progress) var(--cc-progress-pct), transparent);
            transform: scaleX(0);
            transform-origin: left center;
            clip-path: inset(0 0 0 0);
            pointer-events: none;
        }

        .call-chip__slot {
            position: relative;
            flex: none;
            width: calc(var(--cc-font) + 2px);
            height: calc(var(--cc-font) + 2px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .call-chip__name { font-weight: 500; }
        .call-chip__arg { opacity: 0.72; }
        .call-chip__timer { min-width: 4ch; font-variant-numeric: tabular-nums; text-align: right; }

        /* ===== Minimal Linear Loader Style ===== */
        .linear-loader {
            width: 320px;
            background: var(--bg-subtle);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.4);
        }
        .linear-track {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.08);
            border-radius: 6px;
            overflow: hidden;
        }
        .linear-fill {
            height: 100%;
            background: var(--primary);
            border-radius: 6px;
            transition: width 0.2s ease;
        }

        /* ===== Cyber Orbit Loader Style ===== */
        .orbit-loader {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--bg-surface);
            border: 1px solid var(--border-active);
            border-radius: 30px;
            padding: 8px 18px;
            box-shadow: 0 0 15px var(--glow-1);
        }

        /* ===== GlideSelect Styles ===== */
        .glide-select {
            --gs-accent: #f5f5f5;
            --gs-surface: #27272a;
            --gs-highlight: #3f3f46;
            --gs-text: #f5f5f5;
            --gs-radius: 10px;
            --gs-inner-radius: 6px;
            --gs-chip: 32px;
            --gs-row: 30px;
            --gs-font: 13px;
            --gs-menu-w: 240px;
            --gs-pop: 180ms;
            --gs-pop-out: 120ms;
            --gs-glide: 220ms;
            --gs-ease-out: cubic-bezier(0.23, 1, 0.32, 1);
            position: relative;
            display: inline-block;
        }

        .glide-select__trigger {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            height: var(--gs-chip);
            padding: 0 10px 0 12px;
            border: 0;
            border-radius: var(--gs-inner-radius);
            background: var(--gs-surface);
            color: var(--gs-text);
            font-family: inherit;
            font-size: var(--gs-font);
            font-weight: 500;
            line-height: 1;
            cursor: pointer;
            outline: none;
            user-select: none;
            transition: background-color 100ms ease, transform 160ms var(--gs-ease-out);
        }

        .glide-select__trigger:hover {
            background: color-mix(in srgb, var(--gs-highlight) 60%, var(--gs-surface));
        }

        .glide-select__menu {
            position: absolute;
            z-index: 50;
            width: var(--gs-menu-w);
            min-width: 100%;
            top: calc(100% + 6px);
            left: 0;
            max-height: 320px;
            overflow-y: auto;
            padding: 4px;
            border-radius: var(--gs-radius);
            background: var(--gs-surface);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border);
            animation: popIn 180ms var(--gs-ease-out);
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .glide-select__option {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            height: var(--gs-row);
            padding: 0 10px;
            border-radius: var(--gs-inner-radius);
            color: var(--gs-text);
            font-size: var(--gs-font);
            cursor: pointer;
            transition: background-color 150ms ease;
        }

        .glide-select__option:hover, .glide-select__option[aria-selected='true'] {
            background: var(--gs-highlight);
        }

        /* ===== StatusMark Styles ===== */
        .status-mark {
            --sm-size: 18px;
            --sm-stroke: 2;
            --sm-color: currentColor;
            --sm-done: #22c55e;
            --sm-error: #ef4444;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            line-height: 1;
        }
