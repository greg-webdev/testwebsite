name: Generate Commit History and Deploy

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Site Structure, Sitemap, Commits, and Latest Files
        env:
          REPO_NAME: ${{ github.repository }}
        run: |
          python3 - << 'EOF'
          import subprocess
          import os
          import html
          import base64
          from datetime import datetime, timezone

          repo_name = os.environ.get("REPO_NAME", "")
          
          cmd = ["git", "log", "--reverse", "--format=%H|%an|%s|%b|%ad|%at", "--date=iso-strict"]
          result = subprocess.run(cmd, capture_output=True, text=True, check=True)
          
          cominfo_lines = [
              "=== REPOSITORY COMMIT HISTORY ===",
              f"Generated at: {datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M:%SZ')}",
              "==================================",
              ""
          ]
          
          common_style = """
              body {
                  background: #121212;
                  color: #777777;
                  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
                  padding: 24px;
                  margin: 0;
              }
              h1, h2 {
                  color: #e0e0e0;
                  font-weight: 500;
                  margin-top: 0;
                  margin-bottom: 20px;
                  padding-bottom: 8px;
                  border-bottom: 1px solid #222222;
              }
              ul {
                  list-style: none;
                  padding-left: 0;
                  margin: 0;
              }
              li {
                  margin: 6px 0;
              }
              a {
                  color: #666666;
                  text-decoration: none;
                  cursor: pointer;
                  display: inline-block;
                  transition: color 0.25s ease;
              }
              a:hover, a:active {
                  color: #ffffff;
              }
              .commit-entry {
                  padding: 12px 0;
                  border-bottom: 1px solid #1a1a1a;
                  font-size: 0.9rem;
              }
              .commit-entry .header-row {
                  display: flex;
                  justify-content: space-between;
                  margin-bottom: 4px;
                  flex-wrap: wrap;
                  gap: 8px;
              }
              .commit-entry .author {
                  color: #888888;
                  transition: color 0.25s ease;
              }
              .commit-entry .title {
                  color: #888888;
                  font-size: 0.95rem;
                  margin: 4px 0;
                  transition: color 0.25s ease;
              }
              .commit-entry .time, .commit-entry .delta {
                  color: #555555;
                  font-size: 0.8rem;
              }
              .commit-entry .desc {
                  color: #555555;
                  white-space: pre-wrap;
                  margin-top: 6px;
                  font-size: 0.85rem;
                  transition: color 0.25s ease;
              }
              .commit-entry:hover .title,
              .commit-entry:hover .author,
              .commit-entry:hover .desc {
                  color: #dddddd;
              }
              .folder-block {
                  margin: 4px 0;
              }
              .folder-trigger {
                  cursor: pointer;
                  color: #666666;
                  display: inline-block;
                  user-select: none;
                  transition: color 0.25s ease;
              }
              .folder-trigger:hover {
                  color: #ffffff;
              }
              .folder-block.is-open > .folder-trigger {
                  color: #aaaaaa;
              }
              .slide-drawer {
                  display: grid;
                  grid-template-rows: 0fr;
                  transition: grid-template-rows 0.3s cubic-bezier(0.25, 1, 0.5, 1);
              }
              .folder-block.is-open > .slide-drawer {
                  grid-template-rows: 1fr;
              }
              .slide-content {
                  overflow: hidden;
                  margin-left: 14px;
                  padding-left: 10px;
                  border-left: 1px solid #202020;
              }
          """

          commits_html = f"""<!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <title>Commit History</title>
              <style>{common_style}</style>
          </head>
          <body>
              <h2>Repository Commits</h2>
          """
          
          prev_epoch = None
          
          for line in result.stdout.strip().split("\n"):
              if not line:
                  continue
              parts = line.split("|", 5)
              if len(parts) < 6:
                  continue
              commit_hash, author, title, desc, time_iso, time_epoch_str = parts
              time_epoch = int(time_epoch_str)
              
              if prev_epoch is None:
                  diff_str = "First commit (0 seconds)"
              else:
                  diff_sec = max(0, time_epoch - prev_epoch)
                  days = diff_sec // 86400
                  hours = (diff_sec % 86400) // 3600
                  mins = (diff_sec % 3600) // 60
                  secs = diff_sec % 60
                  
                  parts_time = []
                  if days > 0: parts_time.append(f"{days}d")
                  if hours > 0: parts_time.append(f"{hours}h")
                  if mins > 0: parts_time.append(f"{mins}m")
                  parts_time.append(f"{secs}s")
                  diff_str = " ".join(parts_time)
              
              prev_epoch = time_epoch
              
              cominfo_lines.append("--------------------------------------------------")
              cominfo_lines.append(f"Commit Hash : {commit_hash}")
              cominfo_lines.append(f"Author      : {author}")
              cominfo_lines.append(f"Title       : {title}")
              cominfo_lines.append(f"Time        : {time_iso}")
              cominfo_lines.append(f"Time Delta  : {diff_str} after previous commit")
              cominfo_lines.append("Description :")
              if desc.strip():
                  for desc_line in desc.strip().split("\n"):
                      cominfo_lines.append(f"  {desc_line}")
              else:
                  cominfo_lines.append("  (No description provided)")
              cominfo_lines.append("")
              
              esc_title = html.escape(title)
              esc_author = html.escape(author)
              esc_desc = html.escape(desc.strip()) if desc.strip() else "(No description provided)"
              short_hash = commit_hash[:7]
              
              commits_html += f"""
              <div class="commit-entry">
                  <div class="header-row">
                      <span><a href="https://github.com/{repo_name}/commit/{commit_hash}" target="_blank">{short_hash}</a></span>
                      <span class="author">{esc_author}</span>
                  </div>
                  <div class="title">{esc_title}</div>
                  <div class="header-row">
                      <span class="time">{time_iso}</span>
                      <span class="delta">+{diff_str}</span>
                  </div>
                  <div class="desc">{esc_desc}</div>
              </div>
              """
          
          commits_html += """</body>\n</html>"""
          
          os.makedirs("commits", exist_ok=True)
          with open("repository.cominfo", "w", encoding="utf-8") as f:
              f.write("\n".join(cominfo_lines))
              
          with open("commits/index.html", "w", encoding="utf-8") as f:
              f.write(commits_html)

          latest_files_cmd = ["git", "diff-tree", "--no-commit-id", "--name-only", "-r", "HEAD"]
          latest_files_res = subprocess.run(latest_files_cmd, capture_output=True, text=True, check=True)
          changed_files = [f.strip() for f in latest_files_res.stdout.split("\n") if f.strip()]

          latest_html = f"""<!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <title>Latest Changed Files</title>
              <style>{common_style}</style>
          </head>
          <body>
              <h2>Latest Changed Files</h2>
              <ul>
          """

          for file_path in changed_files:
              esc_path = html.escape(file_path)
              latest_html += f'    <li><a href="../{file_path}">{esc_path}</a></li>\n'

          if not changed_files:
              latest_html += '    <li>No files found.</li>\n'

          latest_html += """
              </ul>
          </body>
          </html>
          """

          os.makedirs("latest", exist_ok=True)
          with open("latest/index.html", "w", encoding="utf-8") as f:
              f.write(latest_html)

          def make_tree_node():
              return {"_dirs": {}, "_files": []}

          fs_tree = make_tree_node()

          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if not d.startswith(".git")]
              rel_root = os.path.relpath(root, ".")
              curr = fs_tree
              if rel_root != ".":
                  for segment in rel_root.split(os.sep):
                      if segment not in curr["_dirs"]:
                          curr["_dirs"][segment] = make_tree_node()
                      curr = curr["_dirs"][segment]
              for file in sorted(files):
                  if not file.startswith(".git"):
                      curr["_files"].append((file, os.path.normpath(os.path.join(rel_root, file)).replace("\\", "/")))

          def render_tree(node):
              html_out = ""
              for dirname in sorted(node["_dirs"].keys()):
                  sub_content = render_tree(node["_dirs"][dirname])
                  esc_dir = html.escape(dirname)
                  html_out += f"""<div class="folder-block">
                      <div class="folder-trigger">{esc_dir}/</div>
                      <div class="slide-drawer">
                          <div class="slide-content">
                              {sub_content}
                          </div>
                      </div>
                  </div>\n"""
              
              if node["_files"]:
                  html_out += '<ul>\n'
                  for filename, full_path in node["_files"]:
                      esc_name = html.escape(filename)
                      html_out += f'    <li><a href="{full_path}">{esc_name}</a></li>\n'
                  html_out += '</ul>\n'
              return html_out

          tree_markup = render_tree(fs_tree)

          sitemap_html = f"""<!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <title>HTML Sitemap</title>
              <style>{common_style}</style>
          </head>
          <body>
              <h2>HTML Sitemap</h2>
              {tree_markup}
              <script>
              document.addEventListener("click", (e) => {{
                  const trigger = e.target.closest(".folder-trigger");
                  if (trigger) {{
                      const parent = trigger.parentElement;
                      parent.classList.toggle("is-open");
                  }}
              }});
              </script>
          </body>
          </html>
          """

          with open("sitemap.html", "w", encoding="utf-8") as f:
              f.write(sitemap_html)

          root_html = f"""<!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <title>Index</title>
              <style>{common_style}</style>
          </head>
          <body>
              <h1>Site Directory</h1>
              <ul>
                  <li><a href="commits/">Commit History (/commits)</a></li>
                  <li><a href="latest/">Latest Changed Files (/latest)</a></li>
                  <li><a href="sitemap.html">HTML Sitemap</a></li>
                  <li><a href="repository.cominfo">Repository Cominfo File</a></li>
              </ul>
          </body>
          </html>"""

          with open("index.html", "w", encoding="utf-8") as f:
              f.write(root_html)

          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if not d.startswith(".git")]
              for file in files:
                  if file.endswith(".html"):
                      target_file = os.path.join(root, file)
                      with open(target_file, "rb") as fh:
                          raw_bytes = fh.read()
                      
                      payload_str = base64.b64encode(raw_bytes).decode("utf-8")
                      
                      page_wrapper = f"""<!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Directory</title>
              <style>
                  html, body {{
                      background: #121212;
                      color: #777777;
                      margin: 0;
                      padding: 0;
                  }}
              </style>
          </head>
          <body>
              <script id="bundle-stream" type="text/plain">{payload_str}</script>
              <script>
              (() => {{
                  try {{
                      const raw = document.getElementById("bundle-stream").textContent.trim();
                      const bin = atob(raw);
                      const buf = new Uint8Array(bin.length);
                      for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
                      const doc = new TextDecoder("utf-8").decode(buf);
                      document.open();
                      document.write(doc);
                      document.close();
                  }} catch (e) {{}}
              }})();
              </script>
          </body>
          </html>"""
                      with open(target_file, "w", encoding="utf-8") as fh:
                          fh.write(page_wrapper)
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
