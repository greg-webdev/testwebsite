name: Generate Commit History and Deploy

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Commit Info and Sitemap
        env:
          REPO_NAME: ${{ github.repository }}
        run: |
          COMINFO_FILE="repository.cominfo"
          SITEMAP_FILE="sitemap.html"
          
          # Initialize cominfo
          echo "=== REPOSITORY COMMIT HISTORY ===" > "$COMINFO_FILE"
          echo "Generated at: $(date -u +"%Y-%m-%d %H:%M:%SZ")" >> "$COMINFO_FILE"
          echo "==================================" >> "$COMINFO_FILE"
          echo "" >> "$COMINFO_FILE"

          # Initialize sitemap.html with no rounded corners and link click effects
          cat << 'EOF' > "$SITEMAP_FILE"
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <title>Sitemap & Commit History</title>
              <style>
                  body { background: #0d1117; color: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 16px; margin: 0; }
                  h2 { margin-top: 0; font-size: 1.2rem; color: #f0f6fc; border-bottom: 1px solid #30363d; padding-bottom: 8px; }
                  .commit { background: #161b22; border: 1px solid #30363d; border-radius: 0; padding: 12px; margin-bottom: 12px; font-size: 0.9rem; }
                  .header-row { display: flex; justify-content: space-between; margin-bottom: 6px; flex-wrap: wrap; gap: 8px; }
                  .hash { font-family: monospace; }
                  .author { color: #7ee787; font-weight: bold; }
                  .title { color: #f0f6fc; font-weight: bold; font-size: 1rem; margin: 6px 0; }
                  .time { color: #8b949e; font-size: 0.8rem; font-family: monospace; }
                  .delta { color: #d2a8ff; font-size: 0.8rem; font-family: monospace; }
                  .desc { color: #8b949e; white-space: pre-wrap; margin-top: 8px; font-family: monospace; font-size: 0.85rem; background: #0d1117; padding: 8px; border-radius: 0; border: 1px solid #21262d; }
                  
                  /* Link styling with text fade to white and grey background on click */
                  a { color: #58a6ff; text-decoration: none; }
                  a:active { color: #ffffff; background: #808080; }
              </style>
          </head>
          <body>
              <h2>Commit History Sitemap</h2>
          EOF

          PREV_EPOCH=0

          while IFS='|' read -r HASH AUTHOR TITLE DESC TIME_ISO TIME_EPOCH; do
            if [ "$PREV_EPOCH" -eq 0 ]; then
              DIFF_STR="First commit (0 seconds)"
            else
              DIFF_SEC=$((TIME_EPOCH - PREV_EPOCH))
              if [ "$DIFF_SEC" -lt 0 ]; then
                DIFF_SEC=0
              fi
              
              DAYS=$((DIFF_SEC / 86400))
              HOURS=$(((DIFF_SEC % 86400) / 3600))
              MINS=$(((DIFF_SEC % 3600) / 60))
              SECS=$((DIFF_SEC % 60))
              
              DIFF_STR=""
              [ "$DAYS" -gt 0 ] && DIFF_STR="${DIFF_STR}${DAYS}d "
              [ "$HOURS" -gt 0 ] && DIFF_STR="${DIFF_STR}${HOURS}h "
              [ "$MINS" -gt 0 ] && DIFF_STR="${DIFF_STR}${MINS}m "
              DIFF_STR="${DIFF_STR}${SECS}s"
            fi
            
            PREV_EPOCH="$TIME_EPOCH"

            # Append to .cominfo
            echo "--------------------------------------------------" >> "$COMINFO_FILE"
            echo "Commit Hash : $HASH" >> "$COMINFO_FILE"
            echo "Author      : $AUTHOR" >> "$COMINFO_FILE"
            echo "Title       : $TITLE" >> "$COMINFO_FILE"
            echo "Time        : $TIME_ISO" >> "$COMINFO_FILE"
            echo "Time Delta  : $DIFF_STR after previous commit" >> "$COMINFO_FILE"
            echo "Description :" >> "$COMINFO_FILE"
            if [ -n "$DESC" ]; then
              printf "%s\n" "$DESC" | sed 's/^/  /' >> "$COMINFO_FILE"
            else
              echo "  (No description provided)" >> "$COMINFO_FILE"
            fi
            echo "" >> "$COMINFO_FILE"

            # Escape HTML special chars
            ESC_TITLE=$(echo "$TITLE" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')
            ESC_AUTHOR=$(echo "$AUTHOR" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')
            ESC_DESC=$(echo "$DESC" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')
            SHORT_HASH=$(echo "$HASH" | cut -c1-7)

            # Append card to sitemap.html with clickable commit link
            cat << EOC >> "$SITEMAP_FILE"
              <div class="commit">
                  <div class="header-row">
                      <span class="hash"><a href="https://github.com/$REPO_NAME/commit/$HASH" target="_blank">$SHORT_HASH</a></span>
                      <span class="author">$ESC_AUTHOR</span>
                  </div>
                  <div class="title">$ESC_TITLE</div>
                  <div class="header-row">
                      <span class="time">Time: $TIME_ISO</span>
                      <span class="delta">Delta: +$DIFF_STR</span>
                  </div>
                  <div class="desc">$([ -n "$ESC_DESC" ] && echo "$ESC_DESC" || echo "(No description provided)")</div>
              </div>
          EOC

          done < <(git log --reverse --format="%H|%an|%s|%b|%ad|%at" --date=iso-strict)

          # Close sitemap.html
          echo "</body>" >> "$SITEMAP_FILE"
          echo "</html>" >> "$SITEMAP_FILE"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
