name: Generate Commit History and Deploy

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Site Structure, Sitemap, Commits, and Latest Files
        env:
          REPO_NAME: ${{ github.repository }}
        run: |
          python3 - << 'EOF'
          import subprocess
          import os
          import html
          from datetime import datetime, timezone

          repo_name = os.environ.get("REPO_NAME", "")
          
          cmd = ["git", "log", "--reverse", "--format=%H|%an|%s|%b|%ad|%at", "--date=iso-strict"]
          result = subprocess.run(cmd, capture_output=True, text=True, check=True)
          
          cominfo_lines = [
              "=== REPOSITORY COMMIT HISTORY ===",
              f"Generated at: {datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M:%SZ')}",
              "==================================",
              ""
          ]
          
          commits_html = f"""<!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <title>Commit History</title>
              <style>
                  body {{ background: #0d1117; color: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 16px; margin: 0; }}
                  h2 {{ margin-top: 0; font-size: 1.2rem; color: #f0f6fc; border-bottom: 1px solid #30363d; padding-bottom: 8px; }}
                  .commit {{ background: #161b22; border: 1px solid #30363d; border-radius: 0; padding: 12px; margin-bottom: 12px; font-size: 0.9rem; }}
                  .header-row {{ display: flex; justify-content: space-between; margin-bottom: 6px; flex-wrap: wrap; gap: 8px; }}
                  .hash {{ font-family: monospace; }}
                  .author {{ color: #7ee787; font-weight: bold; }}
                  .title {{ color: #f0f6fc; font-weight: bold; font-size: 1rem; margin: 6px 0; }}
                  .time {{ color: #8b949e; font-size: 0.8rem; font-family: monospace; }}
                  .delta {{ color: #d2a8ff; font-size: 0.8rem; font-family: monospace; }}
                  .desc {{ color: #8b949e; white-space: pre-wrap; margin-top: 8px; font-family: monospace; font-size: 0.85rem; background: #0d1117; padding: 8px; border-radius: 0; border: 1px solid #21262d; }}
                  a {{ color: #6e7681; text-decoration: none; }}
                  a:active {{ color: #ffffff; background: #808080; }}
              </style>
          </head>
          <body>
              <h2>Repository Commits</h2>
          """
          
          prev_epoch = None
          
          for line in result.stdout.strip().split("\n"):
              if not line:
                  continue
              parts = line.split("|", 5)
              if len(parts) < 6:
                  continue
              commit_hash, author, title, desc, time_iso, time_epoch_str = parts
              time_epoch = int(time_epoch_str)
              
              if prev_epoch is None:
                  diff_str = "First commit (0 seconds)"
              else:
                  diff_sec = max(0, time_epoch - prev_epoch)
                  days = diff_sec // 86400
                  hours = (diff_sec % 86400) // 3600
                  mins = (diff_sec % 3600) // 60
                  secs = diff_sec % 60
                  
                  parts_time = []
                  if days > 0: parts_time.append(f"{days}d")
                  if hours > 0: parts_time.append(f"{hours}h")
                  if mins > 0: parts_time.append(f"{mins}m")
                  parts_time.append(f"{secs}s")
                  diff_str = " ".join(parts_time)
              
              prev_epoch = time_epoch
              
              cominfo_lines.append("--------------------------------------------------")
              cominfo_lines.append(f"Commit Hash : {commit_hash}")
              cominfo_lines.append(f"Author      : {author}")
              cominfo_lines.append(f"Title       : {title}")
              cominfo_lines.append(f"Time        : {time_iso}")
              cominfo_lines.append(f"Time Delta  : {diff_str} after previous commit")
              cominfo_lines.append("Description :")
              if desc.strip():
                  for desc_line in desc.strip().split("\n"):
                      cominfo_lines.append(f"  {desc_line}")
              else:
                  cominfo_lines.append("  (No description provided)")
              cominfo_lines.append("")
              
              esc_title = html.escape(title)
              esc_author = html.escape(author)
              esc_desc = html.escape(desc.strip()) if desc.strip() else "(No description provided)"
              short_hash = commit_hash[:7]
              
              commits_html += f"""
              <div class="commit">
                  <div class="header-row">
                      <span class="hash"><a href="https://github.com/{repo_name}/commit/{commit_hash}" target="_blank">{short_hash}</a></span>
                      <span class="author">{esc_author}</span>
                  </div>
                  <div class="title">{esc_title}</div>
                  <div class="header-row">
                      <span class="time">Time: {time_iso}</span>
                      <span class="delta">Delta: +{diff_str}</span>
                  </div>
                  <div class="desc">{esc_desc}</div>
              </div>
              """
          
          commits_html += """</body>\n</html>"""
          
          os.makedirs("commits", exist_ok=True)
          with open("repository.cominfo", "w", encoding="utf-8") as f:
              f.write("\n".join(cominfo_lines))
              
          with open("commits/index.html", "w", encoding="utf-8") as f:
              f.write(commits_html)

          # Get latest changed files from the most recent commit
          latest_files_cmd = ["git", "diff-tree", "--no-commit-id", "--name-only", "-r", "HEAD"]
          latest_files_res = subprocess.run(latest_files_cmd, capture_output=True, text=True, check=True)
          changed_files = [f.strip() for f in latest_files_res.stdout.split("\n") if f.strip()]

          latest_html = f"""<!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <title>Latest Changed Files</title>
              <style>
                  body {{ background: #0d1117; color: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 16px; margin: 0; }}
                  h2 {{ margin-top: 0; font-size: 1.2rem; color: #f0f6fc; border-bottom: 1px solid #30363d; padding-bottom: 8px; }}
                  ul {{ padding-left: 20px; }}
                  li {{ margin-bottom: 8px; font-family: monospace; font-size: 0.9rem; }}
                  a {{ color: #6e7681; text-decoration: none; }}
                  a:active {{ color: #ffffff; background: #808080; }}
              </style>
          </head>
          <body>
              <h2>Latest Changed Files (HEAD)</h2>
              <ul>
          """

          for file_path in changed_files:
              esc_path = html.escape(file_path)
              latest_html += f'    <li><a href="https://github.com/{repo_name}/blob/main/{file_path}" target="_blank">{esc_path}</a></li>\n'

          if not changed_files:
              latest_html += '    <li>No files found.</li>\n'

          latest_html += """
              </ul>
          </body>
          </html>
          """

          os.makedirs("latest", exist_ok=True)
          with open("latest/index.html", "w", encoding="utf-8") as f:
              f.write(latest_html)

          # Generate an actual XML sitemap scanning HTML files
          html_files = []
          for root, dirs, files in os.walk("."):
              if ".git" in root or "commits" in root or "latest" in root:
                  continue
              for file in files:
                  if file.endswith(".html") and file != "index.html":
                      rel_path = os.path.relpath(os.path.join(root, file), ".")
                      html_files.append(rel_path.replace("\\", "/"))

          sitemap_xml = '<?xml version="1.0" encoding="UTF-8"?>\n'
          sitemap_xml += '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n'
          sitemap_xml += '  <url>\n    <loc>https://' + repo_name.split('/')[0] + '.github.io/' + repo_name.split('/')[1] + '/</loc>\n  </url>\n'
          sitemap_xml += '  <url>\n    <loc>https://' + repo_name.split('/')[0] + '.github.io/' + repo_name.split('/')[1] + '/commits/</loc>\n  </url>\n'
          sitemap_xml += '  <url>\n    <loc>https://' + repo_name.split('/')[0] + '.github.io/' + repo_name.split('/')[1] + '/latest/</loc>\n  </url>\n'
          
          for hfile in html_files:
              sitemap_xml += f'  <url>\n    <loc>https://{repo_name.split("/")[0]}.github.io/{repo_name.split("/")[1]}/{hfile}</loc>\n  </url>\n'
          
          sitemap_xml += '</urlset>'

          with open("sitemap.xml", "w", encoding="utf-8") as f:
              f.write(sitemap_xml)

          # Generate sleek root index.html
          root_html = """<!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <title>Index</title>
              <style>
                  body { background: #0d1117; color: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 24px; margin: 0; }
                  h1 { font-size: 1.4rem; color: #f0f6fc; border-bottom: 1px solid #30363d; padding-bottom: 8px; }
                  ul { padding-left: 20px; }
                  li { margin-bottom: 8px; }
                  a { color: #6e7681; text-decoration: none; }
                  a:active { color: #ffffff; background: #808080; }
              </style>
          </head>
          <body>
              <h1>Site Directory</h1>
              <p>Explore site resources below:</p>
              <ul>
                  <li><a href="commits/">Commit History (/commits)</a></li>
                  <li><a href="latest/">Latest Changed Files (/latest)</a></li>
                  <li><a href="sitemap.xml">XML Sitemap</a></li>
                  <li><a href="repository.cominfo">Repository Cominfo File</a></li>
              </ul>
          </body>
          </html>"""

          with open("index.html", "w", encoding="utf-8") as f:
              f.write(root_html)
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
