<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HCF and LCM Calculator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: #121316;
            color: #b0b4ba;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            font-size: 13px;
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 32px 16px 80px 16px;
        }

        .container {
            width: 100%;
            max-width: 640px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card {
            background-color: #17181c;
            border: 1px solid #23252b;
            border-radius: 4px;
            padding: 20px 22px;
        }

        .title {
            color: #e4e7eb;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 16px;
        }

        .input-row::before,
        .input-preview,
        input[type="text"],
        .step-heading,
        .log-row,
        .comparison-grid,
        .formula-card,
        .summary-item {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }

        .inputs-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 16px;
            counter-reset: n;
        }

        .input-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 4px 10px;
            counter-increment: n;
        }

        .input-row::before {
            content: "N" counter(n);
            color: #5c616c;
            font-size: 11px;
            width: 34px;
            flex-shrink: 0;
        }

        .input-row:nth-child(-n+2) .btn-clear-row,
        .input-preview:empty,
        .error-message:empty,
        .formula-eval:empty,
        .card:has(.step-body:empty) {
            display: none;
        }

        .input-preview {
            flex-basis: 100%;
            order: 1;
            padding-left: 44px;
            color: #696f7c;
            font-size: 12px;
            word-break: break-all;
        }

        input[type="text"] {
            background-color: #121316;
            border: 1px solid #23252b;
            border-radius: 4px;
            color: #e4e7eb;
            font-size: 13px;
            padding: 8px 12px;
            flex: 1;
            min-width: 0;
            outline: none;
            transition: border-color 0.15s ease;
        }

        input[type="text"]:focus {
            border-color: #3b3f49;
        }

        .btn-clear-row,
        .btn {
            background: none;
            border: none;
            cursor: pointer;
            border-radius: 4px;
            transition: color 0.15s ease;
            font-family: inherit;
        }

        .btn-clear-row {
            color: #4a4e57;
            font-size: 11px;
            padding: 4px 6px;
            flex-shrink: 0;
        }

        .btn-clear-row:hover {
            color: #d25f5f;
        }

        .button-bar {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .btn {
            padding: 6px 10px;
            font-size: 12px;
            color: #727783;
        }

        .btn:hover:not(:disabled) {
            color: #ffffff;
        }

        .btn:disabled {
            color: #353840;
            cursor: not-allowed;
        }

        .error-message {
            color: #d25f5f;
            font-size: 11px;
            margin-top: 8px;
        }

        .section-title {
            color: #696f7c;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            padding-bottom: 5px;
            border-bottom: 1px solid #1f2127;
        }

        .step-block {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 18px;
            font-size: 12px;
        }

        .step-heading {
            color: #e4e7eb;
            font-size: 12px;
        }

        .log-row {
            color: #818793;
            padding: 3px 0;
            animation: fadeIn 0.15s ease forwards;
            word-break: break-all;
        }

        .log-row.index-form {
            color: #9aa1ad;
            margin-top: 2px;
        }

        .log-row .active-num {
            color: #b5bac5;
        }

        .log-row .final-factor {
            color: #e4e7eb;
        }

        .comparison-grid {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 8px;
            margin-bottom: 16px;
            font-size: 12px;
        }

        .comp-header,
        .comp-row {
            display: grid;
            grid-template-columns: 80px 1fr 1fr;
        }

        .comp-header {
            color: #4f5460;
            font-size: 11px;
            padding-bottom: 4px;
            border-bottom: 1px solid #1f2127;
        }

        .comp-row {
            color: #818793;
            padding: 4px 0;
            animation: fadeIn 0.25s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .comp-row .prime-num {
            color: #c2c7d2;
        }

        .comp-row .comp-val {
            color: #a4abb8;
        }

        .formula-card {
            background-color: #121316;
            border: 1px solid #23252b;
            border-radius: 4px;
            padding: 12px 14px;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            word-break: break-all;
        }

        .formula-label {
            color: #5c616c;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .formula-content {
            color: #e4e7eb;
            font-size: 13px;
            min-height: 20px;
            animation: fadeIn 0.25s ease forwards;
        }

        .formula-eval {
            color: #818793;
            font-size: 12px;
            margin-top: 4px;
            animation: fadeIn 0.25s ease forwards;
        }

        .formula-eval .final-val {
            color: #ffffff;
            font-weight: 500;
        }

        .thinking::after {
            content: "";
            display: inline-block;
            width: 10px;
            height: 10px;
            margin-left: 6px;
            border: 1.5px solid #353840;
            border-top-color: #9aa1ad;
            border-radius: 50%;
            vertical-align: -1px;
            opacity: 0;
            animation: spin 0.6s linear infinite, fadeIn 0.15s ease 0.1s forwards;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .summary-box {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 10px;
        }

        .summary-item {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 12px;
            padding: 8px 10px;
            background-color: #121316;
            border: 1px solid #1f2127;
            border-radius: 4px;
            font-size: 12px;
            word-break: break-all;
        }

        .summary-name {
            color: #696f7c;
            flex-shrink: 0;
        }

        .summary-val {
            color: #e4e7eb;
            text-align: right;
        }

        .summary-item.highlight {
            border-color: #2c3038;
        }

        .summary-item.highlight .summary-name {
            color: #a4abb8;
        }

        .summary-item.highlight .summary-val {
            color: #ffffff;
        }

        sup {
            font-size: 9px;
            color: #9aa1ad;
            margin-left: 1px;
            line-height: 0;
        }

        abbr[title] {
            text-decoration: underline dotted #5c616c;
            text-underline-offset: 3px;
            cursor: help;
        }

        #output-area {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Input Control Panel -->
        <div class="card">
            <div class="title"><abbr title="Highest Common Factor">HCF</abbr> and <abbr title="Lowest Common Multiple">LCM</abbr> Calculator</div>

            <div class="inputs-container" id="inputs-container">
                <div class="input-row">
                    <input type="text" placeholder="Enter integer or expression..." autocomplete="off" spellcheck="false">
                    <span class="input-preview"></span>
                    <button type="button" class="btn-clear-row">remove</button>
                </div>
                <div class="input-row">
                    <input type="text" placeholder="Enter integer or expression..." autocomplete="off" spellcheck="false">
                    <span class="input-preview"></span>
                    <button type="button" class="btn-clear-row">remove</button>
                </div>
            </div>

            <div class="button-bar">
                <button type="button" class="btn" id="btn-calc">Calculate</button>
                <button type="button" class="btn" id="btn-reset">Reset</button>
            </div>

            <div class="error-message" id="error-msg"></div>
        </div>

        <!-- Dynamic Output Stream -->
        <div id="output-area">
            <!-- Step 1: Prime Factorization -->
            <div class="card">
                <div class="section-title">Step 1: Prime Factorization</div>
                <div class="step-body" id="factors-container"></div>
            </div>

            <!-- Step 2: Base & Power Analysis -->
            <div class="card">
                <div class="section-title">Step 2: Base and Power Analysis</div>
                <div class="comparison-grid">
                    <div class="comp-header">
                        <div>Base</div>
                        <div>Min Power (<abbr title="Highest Common Factor">HCF</abbr>)</div>
                        <div>Max Power (<abbr title="Lowest Common Multiple">LCM</abbr>)</div>
                    </div>
                    <div class="step-body comparison-grid" id="comp-rows" style="margin: 0;"></div>
                </div>
            </div>

            <!-- Step 3: Deduction & Construction -->
            <div class="card">
                <div class="section-title">Step 3: Deduction (Index Notation)</div>

                <div class="formula-card">
                    <div class="formula-label">Highest Common Factor (<abbr title="Highest Common Factor">HCF</abbr>)</div>
                    <div class="formula-content step-body" id="hcf-notation"></div>
                    <div class="formula-eval" id="hcf-eval"></div>
                </div>

                <div class="formula-card">
                    <div class="formula-label">Lowest Common Multiple (<abbr title="Lowest Common Multiple">LCM</abbr>)</div>
                    <div class="formula-content" id="lcm-notation"></div>
                    <div class="formula-eval" id="lcm-eval"></div>
                </div>
            </div>

            <!-- Step 4: Summary -->
            <div class="card">
                <div class="section-title">Summary</div>
                <div class="summary-box">
                    <div class="summary-box step-body" id="summary-container" style="margin-top: 0;"></div>
                    <div class="summary-item highlight">
                        <div class="summary-name"><abbr title="Highest Common Factor">HCF</abbr></div>
                        <div class="summary-val" id="hcf-summary-val"></div>
                    </div>
                    <div class="summary-item highlight">
                        <div class="summary-name"><abbr title="Lowest Common Multiple">LCM</abbr></div>
                        <div class="summary-val" id="lcm-summary-val"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const inputsContainer = document.getElementById('inputs-container');
        const btnCalc = document.getElementById('btn-calc');
        const btnReset = document.getElementById('btn-reset');
        const errorMsg = document.getElementById('error-msg');

        const factorsContainer = document.getElementById('factors-container');
        const compRows = document.getElementById('comp-rows');
        const hcfNotation = document.getElementById('hcf-notation');
        const hcfEval = document.getElementById('hcf-eval');
        const lcmNotation = document.getElementById('lcm-notation');
        const lcmEval = document.getElementById('lcm-eval');
        const summaryContainer = document.getElementById('summary-container');
        const hcfSummaryVal = document.getElementById('hcf-summary-val');
        const lcmSummaryVal = document.getElementById('lcm-summary-val');

        let calcRunId = 0;
        let lastInputsKey = '';
        let autoScrollEnabled = true;

        window.addEventListener('wheel', (e) => {
            if (e.deltaY < 0) autoScrollEnabled = false;
            else if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 60) autoScrollEnabled = true;
        }, { passive: true });

        function autoScroll() {
            if (autoScrollEnabled) {
                window.scrollTo({ top: document.documentElement.scrollHeight, behavior: 'smooth' });
            }
        }

        const sleep = (ms, checkAbort) => new Promise((resolve, reject) =>
            setTimeout(() => checkAbort?.() ? reject() : resolve(), ms)
        );

        const sanitizeInput = (val) => val.trim().replace(/[\s\u00A0\u202F,'_]/g, '');
        const formatNum = (val) => BigInt(val).toLocaleString();

        function evaluateExpression(str) {
            const s = sanitizeInput(str).replace(/×/g, '*').replace(/−/g, '-');
            if (!/^[\d+\-*^()]+$/.test(s)) return null;
            try {
                const expr = s.replace(/\^/g, '**').replace(/\b0*(\d+)\b/g, '$1n');
                const res = Function(`"use strict"; return (${expr});`)();
                return typeof res === 'bigint' && res > 0n ? res : null;
            } catch {
                return null;
            }
        }

        function setInputRowState(row, value = '') {
            const input = row.querySelector('input');
            const preview = row.querySelector('.input-preview');
            input.value = value;
            input._runId = (input._runId || 0) + 1;
            preview.textContent = '';
            preview.classList.remove('thinking');
            return row;
        }

        const createInputRow = (value = '') => setInputRowState(inputsContainer.firstElementChild.cloneNode(true), value);

        async function updateInputPreview(input) {
            const preview = input.parentElement.querySelector('.input-preview');
            const runId = (input._runId = (input._runId || 0) + 1);
            const evaluated = evaluateExpression(input.value);
            preview.classList.remove('thinking');
            if (evaluated === null) {
                preview.textContent = '';
                return;
            }
            preview.textContent = `= ${formatNum(evaluated)}`;
            if (evaluated === 1n) return;
            preview.classList.add('thinking');
            try {
                const factors = await factorizeBigInt(evaluated, null, () => input._runId !== runId);
                preview.innerHTML = `= ${formatNum(evaluated)} = ${formatIndexNotation(factors)}`;
            } catch {
                return;
            }
            preview.classList.remove('thinking');
        }

        function getSanitizedValues() {
            return Array.from(inputsContainer.querySelectorAll('input'))
                .map(i => sanitizeInput(i.value))
                .filter(Boolean);
        }

        function setCalculating(active) {
            if (active) autoScrollEnabled = true;
            btnCalc.disabled = active;
            btnReset.disabled = active;
            btnCalc.classList.toggle('thinking', active);
        }

        function clearOutputs() {
            factorsContainer.innerHTML = compRows.innerHTML = hcfNotation.innerHTML = hcfEval.innerHTML = lcmNotation.innerHTML = lcmEval.innerHTML = summaryContainer.innerHTML = '';
        }

        function syncInputsState() {
            const values = getSanitizedValues();
            const key = values.join(',');
            if (key !== lastInputsKey) {
                lastInputsKey = key;
                calcRunId++;
                errorMsg.textContent = '';
                clearOutputs();
                setCalculating(false);
            }
            const search = values.length ? '?n=' + values.map(encodeURIComponent).join(',') : '';
            window.history.replaceState(null, '', window.location.pathname + search + window.location.hash);
        }

        inputsContainer.addEventListener('input', (e) => {
            if (e.target.matches('input')) updateInputPreview(e.target);
            const lastInput = inputsContainer.lastElementChild.querySelector('input');
            if (e.target === lastInput && sanitizeInput(lastInput.value)) {
                inputsContainer.appendChild(createInputRow());
            }
            syncInputsState();
        });

        inputsContainer.addEventListener('click', (e) => {
            if (e.target.matches('.btn-clear-row')) {
                e.target.closest('.input-row').remove();
                syncInputsState();
            }
        });

        async function factorizeBigInt(n, logCallback, checkAbort) {
            const factors = {};
            let current = n;
            let iterations = 0;

            for (let d = 2n; d * d <= current; d += d === 2n ? 1n : 2n) {
                while (current % d === 0n) {
                    if (checkAbort?.()) throw new Error('aborted');
                    factors[d] = (factors[d] || 0) + 1;
                    current /= d;
                    if (logCallback) await logCallback(d, current);
                }
                if (++iterations % 100000 === 0) await sleep(0, checkAbort);
            }

            if (current > 1n) {
                if (checkAbort?.()) throw new Error('aborted');
                factors[current] = (factors[current] || 0) + 1;
                if (logCallback) await logCallback(current, 1n);
            }

            return factors;
        }

        function formatIndexNotation(factorMap) {
            const primes = Object.keys(factorMap).map(BigInt).sort((a, b) => (a < b ? -1 : 1));
            if (!primes.length) return '1';
            return primes.map(p => `${formatNum(p)}<sup>${factorMap[p]}</sup>`).join(' &times; ');
        }

        const evalFactorMap = (factorMap) =>
            Object.entries(factorMap).reduce((acc, [p, exp]) => acc * BigInt(p) ** BigInt(exp), 1n);

        btnCalc.addEventListener('click', async () => {
            if (btnCalc.disabled) return;
            errorMsg.textContent = '';

            const rawValues = getSanitizedValues();
            if (rawValues.length < 2) {
                errorMsg.textContent = 'Please enter at least two numbers.';
                return;
            }

            const numbers = [];
            for (const v of rawValues) {
                const evaluated = evaluateExpression(v);
                if (evaluated === null) {
                    errorMsg.textContent = `Invalid entry: "${v}". Please enter positive integers or valid expressions greater than 0.`;
                    return;
                }
                numbers.push(evaluated);
            }

            const runId = ++calcRunId;
            const checkAbort = () => runId !== calcRunId;
            lastInputsKey = rawValues.join(',');
            setCalculating(true);
            clearOutputs();

            try {
                const allFactorizations = [];

                // Step 1: Prime Factorization
                for (let i = 0; i < numbers.length; i++) {
                    const num = numbers[i];
                    factorsContainer.insertAdjacentHTML('beforeend', `<div class="step-block"><div class="step-heading thinking">N${i + 1} = ${formatNum(num)}</div></div>`);
                    const block = factorsContainer.lastElementChild;
                    autoScroll();

                    const factors = await factorizeBigInt(num, async (prime, remainder) => {
                        block.insertAdjacentHTML('beforeend', `<div class="log-row"><span class="active-num">&divide; ${formatNum(prime)}</span> <span style="color:#4a4e57">&rarr;</span> <span class="final-factor">${formatNum(remainder)}</span></div>`);
                        autoScroll();
                        await sleep(15, checkAbort);
                    }, checkAbort);
                    block.firstElementChild.classList.remove('thinking');

                    allFactorizations.push({ number: num, factors });
                    block.insertAdjacentHTML('beforeend', `<div class="log-row index-form">Index Form: ${formatNum(num)} = ${formatIndexNotation(factors)}</div>`);
                    autoScroll();
                    await sleep(35, checkAbort);
                }

                // Step 2: Base & Power Analysis
                await sleep(250, checkAbort);
                const uniquePrimes = Array.from(
                    new Set(allFactorizations.flatMap(item => Object.keys(item.factors)))
                ).map(BigInt).sort((a, b) => (a < b ? -1 : 1));

                const hcfFactors = {};
                const lcmFactors = {};

                for (const p of uniquePrimes) {
                    const powers = allFactorizations.map(item => item.factors[p] || 0);
                    const minPow = Math.min(...powers);
                    const maxPow = Math.max(...powers);
                    if (minPow > 0) hcfFactors[p] = minPow;
                    if (maxPow > 0) lcmFactors[p] = maxPow;

                    compRows.insertAdjacentHTML('beforeend', `
                        <div class="comp-row">
                            <div class="prime-num">${formatNum(p)}</div>
                            <div class="comp-val">min(${powers.join(', ')}) = ${minPow}</div>
                            <div class="comp-val">max(${powers.join(', ')}) = ${maxPow}</div>
                        </div>
                    `);
                    autoScroll();
                    await sleep(450, checkAbort);
                }

                // Step 3: Deduction
                await sleep(350, checkAbort);
                const hcfVal = evalFactorMap(hcfFactors);
                const lcmVal = evalFactorMap(lcmFactors);

                hcfNotation.innerHTML = formatIndexNotation(hcfFactors);
                hcfEval.innerHTML = `= <span class="final-val">${formatNum(hcfVal)}</span>`;
                autoScroll();
                await sleep(500, checkAbort);

                lcmNotation.innerHTML = formatIndexNotation(lcmFactors);
                lcmEval.innerHTML = `= <span class="final-val">${formatNum(lcmVal)}</span>`;
                autoScroll();
                await sleep(400, checkAbort);

                // Step 4: Summary
                summaryContainer.innerHTML = allFactorizations.map((item, idx) => `
                    <div class="summary-item">
                        <div class="summary-name">N${idx + 1} (${formatNum(item.number)})</div>
                        <div class="summary-val">${formatIndexNotation(item.factors)}</div>
                    </div>
                `).join('');
                hcfSummaryVal.innerHTML = `${formatIndexNotation(hcfFactors)} &nbsp;= ${formatNum(hcfVal)}`;
                lcmSummaryVal.innerHTML = `${formatIndexNotation(lcmFactors)} &nbsp;= ${formatNum(lcmVal)}`;
                autoScroll();
                setCalculating(false);
            } catch {
                // Aborted due to input change
            }
        });

        btnReset.addEventListener('click', () => {
            if (btnReset.disabled) return;
            inputsContainer.querySelectorAll('.input-row:nth-child(n+3)').forEach(row => row.remove());
            inputsContainer.querySelectorAll('.input-row').forEach(row => setInputRowState(row));
            syncInputsState();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        function initFromURL() {
            const nParam = new URLSearchParams(window.location.search).get('n');
            if (!nParam) return;
            const values = nParam.split(',').map(sanitizeInput).filter(Boolean);
            if (!values.length) return;

            while (inputsContainer.children.length < Math.max(2, values.length + 1)) {
                inputsContainer.appendChild(createInputRow());
            }
            const inputs = inputsContainer.querySelectorAll('input');
            values.forEach((val, idx) => {
                inputs[idx].value = val;
                updateInputPreview(inputs[idx]);
            });
            lastInputsKey = values.join(',');
        }

        initFromURL();
    </script>
</body>
</html>
